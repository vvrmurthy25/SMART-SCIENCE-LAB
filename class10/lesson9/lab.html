<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digital Lab – Light: Reflection and Refraction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#DB2777"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>/*css-fallbacks*/html{-webkit-text-size-adjust:100%;text-size-adjust:100%}</style>
<style>
:root{
  --bg:#EEF0F7; --panel:#FFFFFF; --ink:#1D2340; --muted:#5D6485; --line:#CDD2E4;
  --qc:#B91C1C; --ok:#1E8F50; --ok-soft:#D7F2E2; --bad:#C63B3B; --bad-soft:#F8DCDC;
  --accent:#1D2340; --accent-ink:#FFFFFF; --pick:#7C3AED; --cold:#2459C9;
  --wall:#E4ECF2; --tile:#D2DDE6; --glass:#5F7A8A; --lbl:#F1F5F9;
  --c1:#F97316; --c2:#7C3AED; --c3:#DB2777;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12152A; --panel:#1C2038; --ink:#E8EAF6; --muted:#A3A9C9; --line:#323858;
    --qc:#FF8A8A; --ok:#5BD08F; --ok-soft:#173A27; --bad:#F07A7A; --bad-soft:#442022;
    --accent:#E8EAF6; --accent-ink:#12152A; --pick:#B49AFB; --cold:#86A8F5;
    --wall:#1E2639; --tile:#28324A; --glass:#A9C0CE;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12152A; --panel:#1C2038; --ink:#E8EAF6; --muted:#A3A9C9; --line:#323858;
  --qc:#FF8A8A; --ok:#5BD08F; --ok-soft:#173A27; --bad:#F07A7A; --bad-soft:#442022;
  --accent:#E8EAF6; --accent-ink:#12152A; --pick:#B49AFB; --cold:#86A8F5;
  --wall:#1E2639; --tile:#28324A; --glass:#A9C0CE;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Baloo 2",system-ui,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.app{height:100%;display:flex;flex-direction:column;padding:1.4vmin;padding:clamp(6px,1.4vmin,16px);gap:1.2vmin;gap:clamp(6px,1.2vmin,12px);max-width:1500px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
header>div:first-child{min-width:0}
.school{font-size:2vmin;font-size:clamp(12px,2vmin,20px);font-weight:700;color:var(--muted);line-height:1.1;margin-bottom:2px}
h1{margin:0;font-size:3.6vmin;font-size:clamp(20px,3.6vmin,40px);font-weight:800;line-height:1;white-space:nowrap}
h1 span{font-weight:600;color:var(--muted);font-size:.6em;margin-left:.4em}
.hr{display:flex;align-items:center;gap:1vmin;gap:clamp(6px,1vmin,12px)}
.pill{font-size:2.4vmin;font-size:clamp(14px,2.4vmin,26px);font-weight:700;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:.15em .8em;white-space:nowrap}
.ib{font:inherit;font-size:2.6vmin;font-size:clamp(16px,2.6vmin,28px);line-height:1;border:2px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);padding:.18em .55em;cursor:pointer;position:relative}
.ib[aria-pressed="false"]{opacity:.65}
.ib[aria-pressed="false"]::after{content:"";position:absolute;left:18%;right:18%;top:50%;height:3px;background:var(--bad);border-radius:3px;transform:rotate(-35deg)}
@media (max-width:520px){h1 span{display:none}.hr{gap:5px}.ib{padding:.12em .42em}.pill{font-size:3.7vw;font-size:clamp(12px,3.7vw,17px);padding:.12em .6em}}

.lab{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 29%;grid-template-columns:minmax(0,1fr) clamp(230px,29%,430px);gap:1.2vmin;gap:clamp(6px,1.2vmin,12px);position:relative}
.stage{display:flex;flex-direction:column;gap:1.2vmin;gap:clamp(6px,1.2vmin,12px);min-height:0;min-width:0}
.task{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:.3em .6em;display:flex;align-items:center;gap:.5em;font-weight:800;color:var(--qc);font-size:3.1vmin;font-size:clamp(16px,3.1vmin,34px);line-height:1.15;min-height:2.1em}
.task .n{flex:none;width:1.7em;height:1.7em;border-radius:50%;background:var(--qc);color:var(--panel);display:grid;place-items:center;font-size:.8em}
.task .t{flex:1}
.task.done{color:var(--ok)}.task.done .n{background:var(--ok)}
.go{font:inherit;font-weight:800;font-size:.85em;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);padding:.2em .7em;cursor:pointer;white-space:nowrap}
.scene{flex:1;min-height:0;position:relative;border-radius:18px;overflow:hidden;border:2px solid var(--line);background:var(--wall)}
.scene svg{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;width:100%;height:100%;touch-action:none;display:block}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--panel);color:var(--ink);border:2px solid var(--pick);border-radius:999px;padding:.2em 1em;font-weight:700;font-size:2.5vmin;font-size:clamp(14px,2.5vmin,26px);max-width:92%;text-align:center;line-height:1.2;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}

.note{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:1.6vmin;padding:clamp(8px,1.6vmin,18px);display:flex;flex-direction:column;gap:.9vmin;gap:clamp(4px,.9vmin,10px);min-height:0;overflow:hidden;font-size:2.1vmin;font-size:clamp(13px,2.1vmin,23px);line-height:1.25}
.note h2{margin:0;font-size:1.3em;font-weight:800}
.note h3{margin:.2em 0 0;font-size:1.05em;font-weight:800;color:var(--cold)}
.aim{margin:0;color:var(--muted);font-weight:600}
.aim b{color:var(--ink)}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.2em;counter-reset:s}
.steps li{counter-increment:s;display:flex;align-items:center;gap:.45em;font-weight:700;color:var(--muted)}
.steps li::before{content:counter(s);flex:none;width:1.5em;height:1.5em;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.85em}
.steps li.now{color:var(--qc)}
.steps li.now::before{border-color:var(--qc)}
.steps li.done{color:var(--ok)}
.steps li.done::before{content:"✓";background:var(--ok);border-color:var(--ok);color:var(--panel)}
.obs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.3em}
.obs li{font-weight:700;padding-left:1.3em;position:relative;animation:pop .5s ease-out}
.obs li::before{content:"👀";position:absolute;left:0;font-size:.85em}
.obs .empty{color:var(--muted);font-weight:600;font-style:italic}
.obs .empty::before{content:""}
.concl{margin-top:auto;background:var(--ok-soft);border:2px solid var(--ok);border-radius:12px;padding:.4em .6em;font-weight:700;animation:pop .5s ease-out}
.concl .eq{font-size:1.15em;font-weight:800;white-space:nowrap;color:var(--ink)}
.concl .w{color:var(--muted);font-weight:600;font-size:.9em}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* compact notebook: phones and short screens */
@media (max-aspect-ratio:1/1),(max-height:560px){
  .note{flex-direction:row;flex-wrap:wrap;align-items:center;padding:6px 10px;gap:4px 10px;font-size:2.2vmin;font-size:clamp(13px,2.2vmin,18px)}
  .note h2,.aim,.note h3,.concl .w{display:none}
  .steps{flex-direction:row;gap:5px}
  .steps li{font-size:0;gap:0}
  .steps li::before{font-size:13px;width:24px;height:24px}
  .obs{flex:1 1 100%}
  .obs li:not(:last-child){display:none}
  .concl{margin:0;flex:1 1 100%;padding:.2em .5em}
}
@media (max-aspect-ratio:1/1){
  .lab{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
}

/* overlay cards */
.ov{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;z-index:20;display:grid;place-items:center;background:rgba(15,20,40,.45);border-radius:18px;padding:2vmin;padding:clamp(6px,2vmin,24px)}
.ov[hidden]{display:none}
.card{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:2.6vmin;padding:clamp(12px,2.6vmin,30px);width:100%;width:min(100%,820px);max-height:100%;overflow:hidden;display:flex;flex-direction:column;gap:1.2vmin;gap:clamp(6px,1.2vmin,14px);font-size:2.6vmin;font-size:clamp(15px,2.6vmin,27px);line-height:1.25;animation:pop .35s ease-out}
.card h2{margin:0;font-size:4.2vmin;font-size:clamp(22px,4.2vmin,44px);line-height:1.1;font-weight:800}
.card p{margin:0}
.card .sub{color:var(--muted);font-weight:600}
.card .tag{align-self:flex-start;font-weight:700;color:var(--cold);border:2px solid var(--cold);border-radius:999px;padding:0 .8em;white-space:nowrap;font-size:.85em}
.card .safe{background:var(--bad-soft);border-radius:12px;padding:.35em .7em;font-weight:700}
.q{color:var(--qc);font-weight:800;font-size:1.15em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:1.2vmin;gap:clamp(6px,1.2vmin,12px)}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.btn{font:inherit;font-weight:700;color:var(--ink);background:var(--bg);border:3px solid var(--line);border-radius:16px;cursor:pointer;font-size:1em;line-height:1.15;padding:.35em .5em;text-align:center}
.btn.ok{background:var(--ok-soft);border-color:var(--ok)}
.btn.bad{background:var(--bad-soft);border-color:var(--bad)}
.btn:disabled{cursor:default}
.foot{display:flex;align-items:center;gap:10px;min-height:2.2em}
.msg{flex:1;font-weight:700}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.next{font:inherit;font-weight:800;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);padding:.3em 1em;cursor:pointer;white-space:nowrap}
.next.big{font-size:1.15em;align-self:center;padding:.35em 1.4em}
button:focus-visible,[data-m]:focus-visible{outline:3px solid var(--pick);outline-offset:3px}

/* svg parts */
.wall{fill:var(--wall)}
.tile{stroke:var(--tile)}
.gl{stroke:var(--glass)}
.lbl{fill:var(--lbl);font-family:"Baloo 2",system-ui,sans-serif;font-weight:700;font-size:15px;text-anchor:middle;opacity:.85}
[data-m],[data-t]{cursor:grab}
.tall .decor{display:none}
.halo{fill:none;stroke:#FACC15;stroke-width:4;opacity:0;transform-box:fill-box;transform-origin:center;pointer-events:none}
.hint .halo{animation:halo 1.5s ease-out infinite}
@keyframes halo{0%{opacity:.95;transform:scale(.75)}100%{opacity:0;transform:scale(1.35)}}
.flick{transform-box:fill-box;transform-origin:50% 100%;animation:flick .18s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(.92,1.04) skewX(2deg)}to{transform:scale(1.04,.94) skewX(-3deg)}}
.flow{stroke-dasharray:12 7;animation:flow .35s linear infinite}
@keyframes flow{to{stroke-dashoffset:-19}}

/* result card */
.card.resc{width:100%;width:min(100%,1180px);font-size:3.5vmin;font-size:clamp(15px,3.5vmin,40px);gap:1.6vmin;gap:clamp(6px,1.6vmin,20px)}
.card.resc .eqbig{font-size:6vw;font-size:clamp(20px,min(6vw,8.5vmin),88px)}
.res .eqbig{font-weight:800;white-space:nowrap;text-align:center;font-size:5.4vw;font-size:clamp(18px,min(5.4vw,6.4vmin),58px);line-height:1.1;background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:.25em .4em}
.res .word{text-align:center;color:var(--muted);font-weight:700;font-size:.9em;margin-top:-.2em}
.res ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.35em}
.res li{font-weight:700;display:flex;gap:.5em;align-items:flex-start}
.res li b{color:var(--ok)}
.res .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.res .alt{font:inherit;font-weight:700;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);padding:.3em 1em;cursor:pointer}
/* celebration */
.cf{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;pointer-events:none;z-index:80}
.cf i{position:absolute;top:-4vmin;display:block;border-radius:2px;animation:cfall var(--d) ease-in-out var(--dl) forwards;opacity:0}
@keyframes cfall{0%{opacity:1;transform:translate3d(0,0,0) rotate3d(1,1,.3,0deg)}25%{transform:translate3d(calc(var(--sx)*-.6),28vh,0) rotate3d(1,1,.3,calc(var(--r)*.25))}50%{transform:translate3d(var(--sx),56vh,0) rotate3d(1,1,.3,calc(var(--r)*.5))}75%{transform:translate3d(calc(var(--sx)*-.4),84vh,0) rotate3d(1,1,.3,calc(var(--r)*.75))}88%{opacity:1}100%{opacity:0;transform:translate3d(calc(var(--sx)*.5),112vh,0) rotate3d(1,1,.3,var(--r))}}
.homeL{display:inline-block;white-space:nowrap;color:inherit;text-decoration:none;border:2px solid var(--line);border-radius:999px;padding:0 .45em;margin-right:.35em;background:var(--panel)}
/* ---- experiment chooser ---- */
.pickwrap{display:flex;flex-direction:column;gap:1.6vmin;gap:clamp(8px,1.6vmin,18px);width:100%}
.exps{display:grid;grid-template-columns:1fr 1fr;gap:1.6vmin;gap:clamp(8px,1.6vmin,18px)}
.exp{text-align:left;font:inherit;color:var(--ink);background:var(--bg);border:3px solid var(--line);border-radius:18px;padding:2vmin;padding:clamp(10px,2vmin,22px);cursor:pointer;display:flex;flex-direction:column;gap:.3em;transition:transform .15s,border-color .15s,box-shadow .15s}
.exp:hover,.exp:focus-visible{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 10px 26px rgba(0,0,0,.16);outline:none}
.exp .ic{font-size:6vmin;font-size:clamp(28px,6vmin,56px);line-height:1}
.exp b{font-size:2.9vmin;font-size:clamp(16px,2.9vmin,30px);line-height:1.15}
.exp small{color:var(--muted);font-weight:600;font-size:2.1vmin;font-size:clamp(13px,2.1vmin,22px);line-height:1.2}
.exp .tg{align-self:flex-start;font-weight:700;color:var(--cold);border:2px solid var(--cold);border-radius:999px;padding:0 .7em;font-size:1.8vmin;font-size:clamp(11px,1.8vmin,18px);white-space:nowrap}
@media (max-aspect-ratio: 3/4){.exps{grid-template-columns:1fr}.exp{flex-direction:row;align-items:center;gap:.6em;flex-wrap:wrap}.exp .ic{font-size:8vw;font-size:clamp(26px,8vw,40px)}}
.swap{font:inherit;font-weight:700;border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:.1em .7em;cursor:pointer;white-space:nowrap}
.lblD{fill:var(--muted);font-weight:700}
.dayPill{font-weight:800;fill:var(--ink)}
.lbl.big{font-size:34px;fill:var(--ink);opacity:1}
.lbl.sm{font-size:17px}
.lblD.sm{font-size:16px}
.dayPill{font-family:"Baloo 2",system-ui,sans-serif;text-anchor:middle}
.cueG{animation:cueP 1.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes cueP{0%,100%{filter:drop-shadow(0 0 0 rgba(250,204,21,0))}50%{filter:drop-shadow(0 0 14px rgba(250,204,21,.95))}}
@media (prefers-reduced-motion: reduce){.cueG{animation:none;filter:drop-shadow(0 0 10px rgba(250,204,21,.9))}}
.why{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:.4em .7em;font-weight:700;display:flex;gap:.6em;align-items:center;flex-wrap:wrap}
.why b{color:var(--ok)}
.why .next{margin-left:auto}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.next.ghost{background:var(--bg);color:var(--ink);border:2px solid var(--line)}
.hit{pointer-events:all;cursor:pointer}
@media (max-width:620px){
  header>div:first-child{min-width:0;flex:1}
  h1{font-size:4.4vw;font-size:clamp(15px,4.4vw,24px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  h1 span{display:none}
  .hr{flex:none;gap:4px}
  .pill{font-size:3.3vw;font-size:clamp(11px,3.3vw,16px);padding:.12em .55em}
  .swap{font-size:3.2vw;font-size:clamp(11px,3.2vw,16px);padding:.08em .5em}
  .ib{font-size:4vw;font-size:clamp(14px,4vw,20px);padding:.08em .35em}
}
@media (max-width:430px){.swap{font-size:0;padding:.1em .45em}.swap::after{content:"⇄";font-size:16px}}


.zt{font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:24px;fill:var(--ink)}
.zt.sm{font-size:20px}.zt.xs{font-size:16px;font-weight:700;fill:var(--muted)}
.bb{animation:rise var(--d) linear var(--dl) infinite;opacity:0}
@keyframes rise{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(var(--h));opacity:0}}
#mClk,#eClk,#bubM,#bubO,#steamO,#steamE,#bubC1,#bubC2,#oDrop,#eDrop,#smellE,#mZoom,#fx,#Ltop{pointer-events:none}
.eqbig{white-space:nowrap;overflow:hidden}
#ceq{white-space:nowrap;overflow:hidden}
@media (max-aspect-ratio: 3/4){.exp small{display:none}.exp{padding:8px 12px}}
@media (max-height:520px){.exp small{display:none}.exp .ic{font-size:24px}.exp{padding:6px 10px;flex-direction:row;align-items:center;gap:.5em}}

<script>
(()=>{

  const NS="http://www.w3.org/2000/svg";
  const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;

  const mk=(tag,at,par)=>{const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);if(par)par.appendChild(e);return e;};
  const easeIO=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  const easeOut=t=>1-Math.pow(1-t,3);
  const bounce=t=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+.75;if(t<2.5/d)return n*(t-=2.25/d)*t+.9375;return n*(t-=2.625/d)*t+.984375;};
  let gen=0; // bumps on reset, so old animations stop

    mk("rect",{x:x-w,y:inv?AX:b,width:2*w,height:.62*h,rx:3,fill:virtual?"rgba(253,230,138,.45)":"#FDE68A",stroke:"#D97706","stroke-width":2,"stroke-dasharray":da},G);
    const mid=b+sg*.2*h;
    mk("path",{d:`M${x} ${top} C${x+w*1.1} ${mid} ${x+w} ${b} ${x} ${b} C${x-w} ${b} ${x-w*1.1} ${mid} ${x} ${top}Z`,fill:virtual?"rgba(251,146,60,.5)":"#FB923C",stroke:virtual?"#EA580C":"none","stroke-width":1.5,"stroke-dasharray":da},G);
    return G;}
  function tag(g,x,y,t,c){const e=mk("text",{x,y,"text-anchor":"middle",style:`font:800 15px 'Baloo 2',sans-serif;fill:${c||"#1E293B"};paint-order:stroke;stroke:#FFFFFF;stroke-width:4px`},g);e.textContent=t;return e;}
  function board(p,t1,t2){$(p+"B1").textContent=t1;$(p+"B2").textContent=t2;setOp($(p+"Board"),1);}
  async function fadeIn(G,ms){setOp(G,0);await tween(RM?60:ms||600,t=>setOp(G,t));}
  async function moveCand(id,x){const c=$(id);const m=/translate\(([-\d.]+)/.exec(c.getAttribute("transform")||"");const x0=m?+m[1]:0;
    await tween(RM?80:900,t=>c.setAttribute("transform",`translate(${lerp(x0,x,t).toFixed(1)} 0)`));}
  function sun(G){const s=mk("g",{},G);mk("circle",{cx:62,cy:AX-70,r:30,fill:"#FACC15",stroke:"#F59E0B","stroke-width":3},s);
    for(let i=0;i<8;i++){const a=i*Math.PI/4;mk("line",{x1:62+38*Math.cos(a),y1:AX-70+38*Math.sin(a),x2:62+48*Math.cos(a),y2:AX-70+48*Math.sin(a),stroke:"#F59E0B","stroke-width":3,"stroke-linecap":"round"},s);}
    tag(G,62,AX-20,"Sun (far away)","#B45309");}
  function glowPt(G,x){mk("circle",{cx:x,cy:AX,r:16,fill:"rgba(254,240,138,.55)"},G);mk("circle",{cx:x,cy:AX,r:7,fill:"#FEF08A",stroke:"#F59E0B","stroke-width":2.5},G);}
  /* ---------- concave mirror: pole at 560, f = 15 cm, 8 px per cm ---------- */
  const KP=545,KF=15,SCL=8;
  const mx=y=>{const t=(y-(AX-108))/216;return KP-15+60*t*(1-t);};
  async function kSun(){const g=$("kDyn");g.innerHTML="";setOp($("kBoard"),0);const G=mk("g",{},g);sun(G);
    const R=mk("g",{},g);[-60,-30,30,60].forEach((d,i)=>{const y=AX+d,x=mx(y);ray(R,96,y,x,y,i%2?C2:C1);ray(R,x,y,KP-KF*SCL,AX,i%2?C2:C1);});
    await fadeIn(G,600);await fadeIn(R,900);const P=mk("g",{},g);glowPt(P,KP-KF*SCL);tag(P,KP-KF*SCL,AX+92,"Image: a bright point","#B45309");await fadeIn(P,500);setOp($("kMarks"),1);
    board("k","Object at infinity (Sun) → Image at F","Real, inverted, point-sized. F is 15 cm from P, so C is at 30 cm.");
    obs("Object at infinity (the Sun): the rays met at F, 15 cm from the mirror. The image is a real, point-sized bright spot. So C is at 30 cm.");setOp($("kCand"),1);}
  async function kPlace(u,t1,t2,o){const g=$("kDyn");g.innerHTML="";setOp($("kBoard"),0);
    const xo=KP-u*SCL,yt=AX-H;await moveCand("kCand",xo);
    const R=mk("g",{},g),xm=mx(yt);
    ray(R,xo,yt,xm,yt,C1);ray(R,xo,yt,KP,AX,C2);
    if(Math.abs(u-KF)<1e-6){/* at F: reflected rays are parallel */
      const a=extend(xm,yt,KP-KF*SCL,AX,24),b=extend(KP,AX,xo,AX+H,24);ray(R,xm,yt,a[0],a[1],C1);ray(R,KP,AX,b[0],b[1],C2);
      await fadeIn(R,1000);const T=mk("g",{},g);tag(T,250,AX+150,"Reflected rays are parallel → image at infinity","#B91C1C");await fadeIn(T,500);}
    else{const v=1/(1/KF-1/u),m=-v/u,xi=KP-v*SCL,ty=AX-H*m;
      if(v>0){ray(R,xm,yt,xi,ty,C1);ray(R,KP,AX,xi,ty,C2);await fadeIn(R,1000);const I=img(g,xi,m,false);await fadeIn(I,700);}
      else{const a=extend(xm,yt,KP-KF*SCL,AX,KP-210),b=extend(KP,AX,xo,AX+H,KP-210);ray(R,xm,yt,a[0],a[1],C1);ray(R,KP,AX,b[0],b[1],C2);
        await fadeIn(R,900);const D=mk("g",{},g);dash(D,xm,yt,xi,ty);dash(D,KP,AX,xi,ty);await fadeIn(D,600);
        const I=img(g,xi,m,true);tag(I,xi-6,AX+40,"Virtual image","#475569");await fadeIn(I,700);}}
    board("k",t1,t2);obs(o);}
  const K_sun=()=>kSun();
  const K_1=()=>kPlace(45,"Candle beyond C → Image between C and F","Real, inverted, diminished","Candle beyond C (45 cm): the image formed between C and F (22.5 cm). It is real, inverted and smaller.");
  const K_2=()=>kPlace(30,"Candle at C → Image at C","Real, inverted, same size","Candle at C (30 cm): the image formed at C. It is real, inverted and the same size.");
  const K_3=()=>kPlace(20,"Candle between C and F → Image beyond C","Real, inverted, enlarged","Candle between C and F (20 cm): the image formed beyond C (60 cm). It is real, inverted and bigger.");
  const K_F=()=>kPlace(15,"Candle at F → Image at infinity","Real, inverted, highly enlarged","Candle at F (15 cm): the reflected rays came out parallel. The image is at infinity, real, inverted and highly enlarged.");
  const K_4=()=>kPlace(7.5,"Candle between F and P → Image behind the mirror","Virtual, erect, enlarged","Candle between F and P (7.5 cm): the rays spread out. A virtual, erect, enlarged image is seen behind the mirror.");
  /* ---------- convex lens: O at 350, f = 12 cm, 8 px per cm ---------- */
  const VO=350,VF=12;
  async function vSun(){const g=$("vDyn");g.innerHTML="";setOp($("vBoard"),0);const G=mk("g",{},g);sun(G);
    const R=mk("g",{},g);[-60,-30,30,60].forEach((d,i)=>{const y=AX+d;ray(R,96,y,VO,y,i%2?C2:C1);ray(R,VO,y,VO+VF*SCL,AX,i%2?C2:C1);});
    await fadeIn(G,600);await fadeIn(R,900);const P=mk("g",{},g);glowPt(P,VO+VF*SCL);tag(P,VO+VF*SCL,AX+92,"Image: a bright point","#B45309");await fadeIn(P,500);setOp($("vMarks"),1);
    board("v","Object at infinity (Sun) → Image at F₂","Real, inverted, point-sized. F is 12 cm from O, so 2F is at 24 cm.");
    obs("Object at infinity (the Sun): the light met at F₂, 12 cm behind the lens. The image is a real, point-sized bright spot. So 2F₁ and 2F₂ are at 24 cm.");setOp($("vCand"),1);}
  async function vPlace(u,t1,t2,o){const g=$("vDyn");g.innerHTML="";setOp($("vBoard"),0);
    const xo=VO-u*SCL,yt=AX-H;await moveCand("vCand",xo);
    const R=mk("g",{},g);ray(R,xo,yt,VO,yt,C1);ray(R,xo,yt,VO,AX,C2);
    if(Math.abs(u-VF)<1e-6){const a=extend(VO,yt,VO+VF*SCL,AX,690),b=extend(xo,yt,VO,AX,690);ray(R,VO,yt,a[0],a[1],C1);ray(R,VO,AX,b[0],b[1],C2);
      await fadeIn(R,1000);const T=mk("g",{},g);tag(T,520,AX+150,"Refracted rays are parallel → image at infinity","#B91C1C");await fadeIn(T,500);}
    else{const v=1/(1/VF-1/u),m=-v/u,virt=v<0,xi=VO+v*SCL,ty=AX-H*m;
      if(!virt){ray(R,VO,yt,xi,ty,C1);ray(R,VO,AX,xi,ty,C2);await fadeIn(R,1000);const I=img(g,xi,m,false);await fadeIn(I,700);}
      else{const a=extend(VO,yt,VO+VF*SCL,AX,600),b=extend(xo,yt,VO,AX,600);ray(R,VO,yt,a[0],a[1],C1);ray(R,VO,AX,b[0],b[1],C2);
        await fadeIn(R,900);const D=mk("g",{},g);dash(D,VO,yt,xi,ty);dash(D,VO,AX,xi,ty);await fadeIn(D,600);
        const I=img(g,xi,m,true);tag(I,xi,AX+40,"Virtual image","#475569");await fadeIn(I,700);}}
    board("v",t1,t2);obs(o);}
  const V_sun=()=>vSun();
  const V_1=()=>vPlace(30,"Candle beyond 2F₁ → Image between F₂ and 2F₂","Real, inverted, diminished","Candle beyond 2F₁ (30 cm): the image formed between F₂ and 2F₂ (20 cm). It is real, inverted and smaller.");
  const V_2=()=>vPlace(24,"Candle at 2F₁ → Image at 2F₂","Real, inverted, same size","Candle at 2F₁ (24 cm): the image formed at 2F₂ (24 cm). It is real, inverted and the same size.");
  const V_3=()=>vPlace(18,"Candle between F₁ and 2F₁ → Image beyond 2F₂","Real, inverted, enlarged","Candle between F₁ and 2F₁ (18 cm): the image formed beyond 2F₂ (36 cm). It is real, inverted and bigger.");
  const V_F=()=>vPlace(12,"Candle at F₁ → Image at infinity","Real, inverted, highly enlarged","Candle at F₁ (12 cm): the refracted rays came out parallel. The image is at infinity, real, inverted and highly enlarged.");
  const V_4=()=>vPlace(8,"Candle between F₁ and O → Image on the same side","Virtual, erect, enlarged","Candle between F₁ and O (8 cm): the rays spread out. A virtual, erect, enlarged image is seen on the candle's side, like in a magnifying glass.");
  /* glass slab */
  const sI=[300,250],sE=[347.5,350],dI=[.643,.766];
  const pt=(p,d,t)=>[p[0]+d[0]*t,p[1]+d[1]*t];
  function pin(g,p,l){mk("circle",{cx:p[0],cy:p[1],r:6,fill:"#DC2626",stroke:"#7F1D1D","stroke-width":1.5},g);
    const t=mk("text",{x:p[0]-16,y:p[1]+5,class:"lblD",style:"font-size:16px;fill:#1E293B"},g);t.textContent=l;}
  const sA=pt(sI,dI,-95),sB=pt(sI,dI,-45),sC=pt(sE,dI,45),sD=pt(sE,dI,95);
  async function S_slab(){await hideItem("sSlab");await tween(RM?60:700,t=>setOp($("sGlass"),t));
    obs("The glass slab was placed on the paper and its outline was drawn.");say("Outline drawn.");}
  async function S_pins(){await hideItem("sPins");const G=mk("g",{},$("sDyn"));pin(G,sA,"A");pin(G,sB,"B");await fadeIn(G,600);
    obs("Pins A and B were fixed on a slanting line that meets the top face of the slab.");say("Pins A and B fixed.");}
  async function S_eye(){await hideItem("sEye");const G=mk("g",{},$("sDyn"));pin(G,sC,"C");pin(G,sD,"D");
    mk("line",{x1:sD[0],y1:sD[1],x2:sD[0]+40,y2:sD[1]+48,stroke:"#2563EB","stroke-width":2,"stroke-dasharray":"4 5"},G);
    await fadeIn(G,600);obs("Looking through the slab from the other side, pins C and D were fixed in line with the images of A and B.");say("Pins C and D fixed.");}
  async function S_ruler(){await hideItem("sRuler");const g=$("sDyn"),G=mk("g",{},g);
    [[sI,-48,48],[sE,-48,48]].forEach(([p,a,b])=>mk("line",{x1:p[0],y1:p[1]+a,x2:p[0],y2:p[1]+b,stroke:"#64748B","stroke-width":2,"stroke-dasharray":"7 6"},G));
    ray(G,sA[0],sA[1],sI[0],sI[1]);ray(G,sI[0],sI[1],sE[0],sE[1]);ray(G,sE[0],sE[1],sD[0],sD[1]);
    await fadeIn(G,800);obs("Joining the pins gave the incident ray, the refracted ray inside the glass and the emergent ray. Normals were drawn at both points.");say("Rays drawn.");}
  async function S_prot(){await hideItem("sProt");const g=$("sDyn"),G=mk("g",{},g);
    const lab=(x,y,t,c)=>{const e=mk("text",{x,y,class:"lblD",style:`font-size:16px;fill:${c||"#7C3AED"}`},G);e.textContent=t;};
    lab(sI[0]-44,sI[1]-24,"∠i = 40°");lab(sI[0]+30,sI[1]+44,"∠r = 25°");lab(sE[0]+46,sE[1]+40,"∠e = 40°");
    const X=pt(sI,dI,175);mk("line",{x1:sI[0],y1:sI[1],x2:X[0],y2:X[1],stroke:"#DC2626","stroke-width":2.5,"stroke-dasharray":"5 6"},G);
    const q=pt(sE,dI,70),qx=pt(sI,dI,170);
    mk("line",{x1:q[0],y1:q[1],x2:qx[0],y2:qx[1],stroke:"#16A34A","stroke-width":4},G);
    lab((q[0]+qx[0])/2+40,(q[1]+qx[1])/2+4,"sideways shift","#16A34A");
    await fadeIn(G,800);obs("∠i = 40°, ∠r = 25° and ∠e = 40°. The emergent ray is parallel to the incident ray, but shifted sideways.");say("Angle i equals angle e.");}

  const ACTS={
    K:[{keys:["mirror"],fn:K_sun,cue:"kMir"},{keys:["candle"],fn:K_1,cue:"kCand"},{keys:["candle"],fn:K_2,cue:"kCand"},{keys:["candle"],fn:K_3,cue:"kCand"},{keys:["candle"],fn:K_F,cue:"kCand"},{keys:["candle"],fn:K_4,cue:"kCand"}],
    V:[{keys:["lens"],fn:V_sun,cue:"vLens"},{keys:["candle"],fn:V_1,cue:"vCand"},{keys:["candle"],fn:V_2,cue:"vCand"},{keys:["candle"],fn:V_3,cue:"vCand"},{keys:["candle"],fn:V_F,cue:"vCand"},{keys:["candle"],fn:V_4,cue:"vCand"}],
    S:[{keys:["slab"],fn:S_slab,cue:"sSlab"},{keys:["pins"],fn:S_pins,cue:"sPins"},{keys:["eye"],fn:S_eye,cue:"sEye"},{keys:["ruler"],fn:S_ruler,cue:"sRuler"},{keys:["prot"],fn:S_prot,cue:"sProt"}]
  };

  async function act(key){
    if(!EXP||done||busy)return;
    const cur=ACTS[EXP.key][step];if(!cur)return;
    if(!cur.keys.includes(key)){wrong();return;}
    busy=true;clearHalos();
    try{await cur.fn();step++;markStep();
      if(step>=ACTS[EXP.key].length)finish();else{setTask();setPill();cue();}
    }catch(e){if(e!=="reset")console.error(e);}
    busy=false;
  }
  function wrong(){say("Not yet — "+EXP.stepTasks[step]);Snd.bad&&Snd.bad();}
  function cue(){clearHalos();const c=ACTS[EXP.key][step];if(c)halo($(c.cue));}

  // ======================= finish, result, quiz =======================
  function finish(){
    done=true;setPill();clearHalos();
    $("tt").textContent="Experiment complete. Read your lab record, then check yourself.";$("tn").textContent="✓";
    $("chk").hidden=false;
    $("cw1").textContent=EXP.conc.w1;$("ceq").textContent=EXP.conc.eq;$("cw2").textContent=EXP.conc.w2;
    $("concl").hidden=false;markStep();fitText($("ceq"));
    const g0=gen;setTimeout(()=>{if(g0===gen&&done&&$("ov").hidden)resultCard();},RM?600:5000);
  }
  function resultCard(){
    const c=$("card");c.className="card res resc";
    c.innerHTML=`<span class="tag">${EXP.tag}</span>
      <h2>🎉 Experiment complete!</h2>
      <div class="eqbig">${EXP.conc.eq}</div>
      <p>${EXP.conc.w1}</p><p class="sub">${EXP.conc.w2}</p>
      <div class="row"><button class="next big" id="toQuiz">📝 Check yourself</button>
      <button class="next ghost" id="again">↺ Do it again</button>
      <button class="next ghost" id="other">⇄ Other experiment</button></div>`;
    $("ov").hidden=false;fitText(c.querySelector(".eqbig"));
    celebrate();Snd.fan&&Snd.fan();Say.say(EXP.conc.w1);
    $("toQuiz").onclick=startQuiz;$("again").onclick=()=>begin(EXP);$("other").onclick=chooser;
  }
  let qi=0,qScore=0;
  function startQuiz(){qi=0;qScore=0;askQ();}
  function askQ(){
    if(qi>=EXP.quiz.length){quizEnd();return;}
    const it=EXP.quiz[qi],opts=shuffle([it.a,...it.t]);
    const c=$("card");c.className="card";
    c.innerHTML=`<span class="tag">Question ${qi+1} of ${EXP.quiz.length}</span><h2>${it.q}</h2><div class="opts" id="qo"></div><div class="why" id="why" hidden></div>`;
    const box=$("qo");
    opts.forEach(o=>{const b=document.createElement("button");b.className="btn";b.type="button";b.textContent=o;
      b.onclick=()=>{if(box.dataset.done)return;box.dataset.done="1";const ok=o===it.a;
        [...box.children].forEach(x=>{x.disabled=true;if(x.textContent===it.a)x.classList.add("ok");else if(x===b)x.classList.add("bad");});
        if(ok){qScore++;Snd.ok&&Snd.ok();}
        const w=$("why");w.hidden=false;
        w.innerHTML=`<b>${ok?"✔ Correct.":"✘ Not quite."}</b> ${it.w} <button class="next" id="nq">${qi+1<EXP.quiz.length?"Next ▸":"See my score"}</button>`;
        $("nq").onclick=()=>{qi++;askQ();};};
      box.appendChild(b);});
    $("ov").hidden=false;
  }
  function quizEnd(){
    const good=qScore>=4,c=$("card");c.className="card res";
    c.innerHTML=`<h2>🌟 You scored ${qScore} / ${EXP.quiz.length}</h2>
      <p>${good?"Great work! You understand this experiment.":"Good try. Read your lab record once more and try again."}</p>
      <div class="row"><button class="next big" id="rq">↺ Try the questions again</button><button class="next ghost" id="other2">⇄ Other experiment</button></div>`;
    if(good){celebrate();Snd.fan&&Snd.fan();}
    $("rq").onclick=startQuiz;$("other2").onclick=chooser;
  }

  // ======================= chooser, intro, begin =======================
  function chooser(){
    gen++;busy=false;Snd.fizzStop&&Snd.fizzStop();
    const c=$("card");c.className="card";
    c.innerHTML=`<h2>🔬 Choose an experiment</h2><p class="sub">Chapter 9 — Light: Reflection and Refraction. Tap a card to begin.</p>
      <div class="pickwrap"><div class="exps">${EXPS.map(e=>`<button class="exp" type="button" data-k="${e.key}" id="pick${e.key}"><span class="ic">${e.ic}</span><span class="tg">${e.tag}</span><b>${e.name}</b><small>${e.blurb}</small></button>`).join("")}</div></div>`;
    $("ov").hidden=false;
    c.querySelectorAll(".exp").forEach(b=>b.onclick=()=>intro(BYKEY[b.dataset.k]));
  }
  function intro(E){
    const c=$("card");c.className="card";
    c.innerHTML=`<span class="tag">${E.tag}</span><h2>${E.name}</h2><p class="sub"><b>Aim:</b> ${E.aim}</p><p>${E.intro}</p>
      <p class="safe">${E.safe}</p>
      <div class="row"><button class="next big" id="go">▶ Start experiment</button><button class="next ghost" id="back">◂ Back</button></div>`;
    $("ov").hidden=false;$("go").onclick=()=>begin(E);$("back").onclick=chooser;
  }
  function begin(E){
    gen++;busy=false;Snd.fizzStop&&Snd.fizzStop();
    EXP=E;step=0;done=false;useScene(E.key);RESET[E.key]();fitView();
    $("hsub").textContent=E.sub;buildRecord();setTask();setPill();markStep();
    $("chk").hidden=true;$("ov").hidden=true;cue();Say.say(E.stepTasks[0]);
    if(E.key!=="S"&&innerHeight>innerWidth&&innerWidth<700)setTimeout(()=>say("Tip: turn your phone sideways for a bigger view.",3600),400);
  }

  // ======================= wiring =======================
  svg.addEventListener("click",e=>{const g=e.target.closest("[data-t]");if(g)act(g.dataset.t);});
  svg.addEventListener("keydown",e=>{if(e.key!=="Enter"&&e.key!==" ")return;const g=e.target.closest("[data-t]");if(g){e.preventDefault();act(g.dataset.t);}});
  $("chk").onclick=startQuiz;
  $("rst").onclick=()=>{if(EXP)begin(EXP);else chooser();};
  $("swap").onclick=chooser;

  function celebrate(){return;/*no confetti in labs*/
    const box=document.createElement("div");box.className="cf";
    const cols=["#F97316","#2563EB","#DB2777","#16A34A","#FACC15","#7C3AED","#DC2626","#0D9488"];
    for(let k=0;k<80;k++){const p=document.createElement("i"),w=14+Math.random()*12;
      p.style.left=(Math.random()*100)+"%";p.style.width=w+"px";p.style.height=(w*(Math.random()<.5?1:1.8))+"px";p.style.background=cols[k%cols.length];
      p.style.setProperty("--d",(4+Math.random()*1.5).toFixed(2)+"s");p.style.setProperty("--dl",(Math.random()*1.2).toFixed(2)+"s");
      p.style.setProperty("--sx",((Math.random()-.5)*10).toFixed(1)+"vw");p.style.setProperty("--r",((Math.random()<.5?-1:1)*(360+Math.random()*540)|0)+"deg");
      box.appendChild(p);}
    document.body.appendChild(box);setTimeout(()=>box.remove(),7000);
  }
  const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  function fitView(){const r=$("scene").getBoundingClientRect();const tall=r.height/r.width>1.05;svg.setAttribute("viewBox",tall?(EXP&&EXP.key==="S"?"60 150 600 420":"14 90 672 452"):"0 86 700 534");}
  addEventListener("resize",()=>{fitView();fitText($("ceq"));});fitView();
  chooser();
})();

</script>
<script>
/* ===== Auto-fit (v1): keeps every page inside the screen on any phone, tablet or smart panel ===== */
(function(){
  const D=document.documentElement;let Z=1,busy=false,tm=0;
  const canZoom=("zoom" in D.style);
  const setZ=z=>{Z=z;D.style.zoom=z===1?"":String(z);};
  function clipOf(e){for(let p=e.parentElement;p&&p!==document.body;p=p.parentElement){const s=getComputedStyle(p);
      if(s.position==="fixed"&&p.classList.contains("cf"))return null;
      const o=s.overflowX+s.overflowY;if(/auto|scroll/.test(o))return null;if(/hidden|clip/.test(o)||(p.tagName==="SECTION"&&p.classList.contains("on")))return p;}return document.body;}
  let WHY=[];
