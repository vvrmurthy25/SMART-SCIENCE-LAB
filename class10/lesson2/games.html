<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Play and Learn – Acids, Bases and Salts</title>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>/*css-fallbacks*/


:root{
  --bg:#EDF1F6; --panel:#FFFFFF; --ink:#16263D; --muted:#56657E; --line:#C9D3E1;
  --ok:#1E8F50; --ok-soft:#D7F2E2; --bad:#C63B3B; --bad-soft:#F8DCDC;
  --tab:#D6DEEA; --accent:#16263D; --accent-ink:#FFFFFF; --pick:#7C3AED;
  --rayA:#E07B00; --rayB:#D02F6B; --dev:#2B6CB0; --glass:rgba(66,153,225,.18);
  --obj:#1E8F50; --img:#7C3AED; --axis:#9AA7BB; --chip:#E6ECF4;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1726; --panel:#18233A; --ink:#E6EDF7; --muted:#9FB0C8; --line:#2D3D5A;
    --ok:#5BD08F; --ok-soft:#173A27; --bad:#F07A7A; --bad-soft:#442022;
    --tab:#24324D; --accent:#E6EDF7; --accent-ink:#0F1726; --pick:#B49AFB;
    --rayA:#FFB347; --rayB:#FF7FAE; --dev:#7CB7F2; --glass:rgba(124,183,242,.18);
    --obj:#5BD08F; --img:#C3A6FF; --axis:#5E6F8C; --chip:#22314C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1726; --panel:#18233A; --ink:#E6EDF7; --muted:#9FB0C8; --line:#2D3D5A;
  --ok:#5BD08F; --ok-soft:#173A27; --bad:#F07A7A; --bad-soft:#442022;
  --tab:#24324D; --accent:#E6EDF7; --accent-ink:#0F1726; --pick:#B49AFB;
  --rayA:#FFB347; --rayB:#FF7FAE; --dev:#7CB7F2; --glass:rgba(124,183,242,.18);
  --obj:#5BD08F; --img:#C3A6FF; --axis:#5E6F8C; --chip:#22314C;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Baloo 2",system-ui,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
.app{height:100%;display:flex;flex-direction:column;padding:1.4vmin;padding:clamp(6px,1.4vmin,16px);gap:1.2vmin;gap:clamp(6px,1.2vmin,12px);max-width:1400px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.school{font-size:2vmin;font-size:clamp(12px,2vmin,20px);font-weight:700;color:var(--muted);line-height:1.1;margin-bottom:2px}
h1{margin:0;font-size:3.6vmin;font-size:clamp(20px,3.6vmin,40px);font-weight:800;line-height:1;letter-spacing:-.01em}
h1 span{white-space:nowrap;font-weight:600;color:var(--muted);font-size:.6em;margin-left:.4em}
.score{font-size:2.4vmin;font-size:clamp(14px,2.4vmin,26px);font-weight:700;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:.15em .8em;white-space:nowrap}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:.8vmin;gap:clamp(4px,.8vmin,10px)}
nav button{font:inherit;font-weight:700;font-size:2.2vmin;font-size:clamp(12px,2.2vmin,22px);line-height:1.1;border:0;border-radius:12px;background:var(--tab);color:var(--ink);padding:1.1vmin 4px;padding:clamp(6px,1.1vmin,12px) 4px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
main{flex:1;min-height:0;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:1.8vmin;padding:clamp(8px,1.8vmin,22px);display:flex;flex-direction:column;overflow:hidden}
.game{display:none;flex:1;min-height:0;flex-direction:column;gap:1.2vmin;gap:clamp(6px,1.2vmin,12px)}
.game.on{display:flex}
.q{font-size:3.1vmin;font-size:clamp(16px,3.1vmin,34px);font-weight:700;line-height:1.15;text-align:center;margin:0}
.q .dv{color:var(--dev)}
.t{white-space:nowrap}
.scene{flex:1;min-height:0;display:flex;justify-content:center;position:relative}
.scene svg{position:absolute;top:0;left:0;right:0;bottom:0;margin:auto;width:100%;height:100%;max-width:1100px;display:block}/*panel-fix*/@media (min-height:500px){.scene{min-height:80px}}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:1.1vmin;gap:clamp(6px,1.1vmin,12px)}
.opts.two{grid-template-columns:1fr 1fr}
.opts.grow{flex:1;min-height:0;grid-auto-rows:1fr}
.btn{font:inherit;font-weight:700;color:var(--ink);background:var(--bg);border:3px solid var(--line);border-radius:14px;cursor:pointer;font-size:2.7vmin;font-size:clamp(14px,2.7vmin,30px);line-height:1.12;padding:.3em .35em;min-height:0;display:flex;align-items:center;justify-content:center;gap:.4em;text-align:center}
.btn .lbl{display:inline-block}
.btn .lbl.one{white-space:nowrap}
.btn small{display:block;font-size:.78em;font-weight:600;color:var(--muted)}
.btn.ok{background:var(--ok-soft);border-color:var(--ok)}
.btn.bad{background:var(--bad-soft);border-color:var(--bad)}
.btn.ok small,.btn.bad small{color:var(--ink)}
.btn:disabled{cursor:default}
.btn svg{width:1.6em;height:1.6em;flex:none}
.foot{display:flex;align-items:center;gap:10px;min-height:7vmin;min-height:clamp(40px,7vmin,70px)}
.msg{flex:1;font-size:2.3vmin;font-size:clamp(13px,2.3vmin,24px);font-weight:600;line-height:1.2}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.msg .w{color:var(--ink);font-weight:600}
.next{font:inherit;font-weight:800;font-size:2.6vmin;font-size:clamp(15px,2.6vmin,28px);border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);padding:.35em 1.1em;cursor:pointer;white-space:nowrap}
[hidden]{display:none!important}
button:focus-visible{outline:3px solid var(--pick);outline-offset:2px}


:root{--eye:#FFFFFF;--iris:#7A4A24;--retina:#D9534F;--nerve:#E2A73B;--cil:#E9A3A3;--wl:#16263D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--eye:#22304A;--iris:#C99464;--retina:#F07A7A;--nerve:#D9A54A;--cil:#B86B6B;--wl:#F3F6FB}}
:root[data-theme="dark"]{--eye:#22304A;--iris:#C99464;--retina:#F07A7A;--nerve:#D9A54A;--cil:#B86B6B;--wl:#F3F6FB}
nav{grid-template-columns:repeat(4,1fr)}
.tag{align-self:center;font-size:1.8vmin;font-size:clamp(11px,1.8vmin,18px);font-weight:700;color:var(--dev);border:2px solid var(--dev);border-radius:999px;padding:0 .8em;white-space:nowrap}
.tag.think{color:var(--pick);border-color:var(--pick)}
.opts.col{grid-template-columns:1fr}
.opts.four{grid-template-columns:repeat(4,1fr)}
.opts.col .btn{justify-content:flex-start;text-align:left;font-size:2.4vmin;font-size:clamp(14px,2.4vmin,26px)}
.opts.grow.col .btn{font-size:3vmin;font-size:clamp(16px,3vmin,32px);padding:.3em .8em}
.btn .sw{display:inline-block;width:.9em;height:.9em;border-radius:50%;flex:none;border:2px solid var(--line)}
.btn .num{display:inline-flex;align-items:center;justify-content:center;min-width:1.3em;height:1.3em;border-radius:50%;background:var(--ok);color:var(--panel);font-size:.8em;flex:none}
.btn.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.given{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:1vmin;gap:clamp(5px,1vmin,12px);font-size:2.8vmin;font-size:clamp(15px,2.8vmin,30px);font-weight:700}
.given .g{background:var(--chip);border-radius:10px;padding:.05em .55em;white-space:nowrap}
.given .g.ask{background:transparent;border:2px dashed var(--pick)}
.formula{display:flex;justify-content:center;align-items:center;gap:.3em;font-size:3.4vmin;font-size:clamp(18px,3.4vmin,38px);font-weight:800;white-space:nowrap;flex-wrap:wrap}
.formula .cap{font-size:.5em;font-weight:700;color:var(--muted);margin-right:.4em}
.formula .rl{font-size:.55em;font-weight:700;color:var(--muted);margin-left:.6em}
.fr{display:inline-flex;flex-direction:column;align-items:center;line-height:1;vertical-align:middle;font-size:.85em}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 .15em .05em}
.fr>span:last-child{padding:.05em .15em 0}
.card{align-self:center;display:flex;align-items:center;gap:.5em;font-size:4vmin;font-size:clamp(19px,4vmin,44px);font-weight:800;text-align:center;line-height:1.12;padding:.25em .7em;border-radius:18px;background:var(--chip);max-width:100%}
.card .ic{font-size:1.4em;flex:none}
.spacer{flex:1;min-height:0}

/* svg */
.pt{fill:var(--ink);font-size:16px;font-weight:800;text-anchor:middle;font-family:"Baloo 2",system-ui,sans-serif;paint-order:stroke;stroke:var(--panel);stroke-width:5px;stroke-linejoin:round}
.pt.q{fill:var(--pick);font-size:22px}
.pt.okc{fill:var(--ok)}
.note{fill:var(--muted);font-size:15px;font-weight:700;text-anchor:middle;font-family:"Baloo 2",system-ui,sans-serif;paint-order:stroke;stroke:var(--panel);stroke-width:4px}
.emo{font-size:40px;text-anchor:middle;dominant-baseline:central}
.eyeball{fill:var(--eye);stroke:var(--ink);stroke-width:2.5}
.cornea{fill:var(--glass);stroke:var(--dev);stroke-width:2.5}
.iris{stroke:var(--iris);stroke-width:7;stroke-linecap:round}
.lens{fill:var(--glass);stroke:var(--dev);stroke-width:2.5;transition:rx .8s ease}
.cil{fill:var(--cil);stroke:var(--ink);stroke-width:1.5}
.sus{stroke:var(--muted);stroke-width:1.5}
.retina{fill:none;stroke:var(--retina);stroke-width:6;stroke-linecap:round}
.nerve{fill:var(--nerve);stroke:var(--ink);stroke-width:1.5}
.pupil{fill:none;stroke-width:3;stroke-dasharray:4 3}
.lead{stroke:var(--muted);stroke-width:1.5}
.lead.hl{stroke:var(--pick);stroke-width:2.5}
.hl{stroke:var(--pick)!important;stroke-width:6;animation:pulse 1.1s ease-in-out infinite}
.hl.retina{stroke-width:9}
.hl.iris{stroke-width:10}
@keyframes pulse{50%{opacity:.4}}
.ray{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.ray.a{stroke:var(--rayA)} .ray.ok{stroke:var(--ok)} .ray.w{stroke:var(--wl);stroke-width:3.2}
.ray.dash{stroke-dasharray:6 5;opacity:.75}
.ray.ghost{stroke:var(--axis);opacity:.55}
.ray.hlr{stroke:var(--pick);stroke-width:5;animation:pulse 1.1s ease-in-out infinite}
.dot{fill:var(--img)}
.dot.bad{fill:var(--bad)}
.spec{fill:var(--glass);stroke:var(--dev);stroke-width:3}
.prism{fill:var(--glass);stroke:var(--dev);stroke-width:3;stroke-linejoin:round}
.norm{stroke:var(--axis);stroke-width:1.6;stroke-dasharray:5 4}
.arc{fill:none;stroke:var(--muted);stroke-width:2.2}
.arc.hl{stroke-width:4}
.ang{fill:var(--muted);font-size:18px;font-weight:800;font-style:italic;text-anchor:middle;dominant-baseline:central;font-family:"Baloo 2",system-ui,sans-serif;paint-order:stroke;stroke:var(--panel);stroke-width:4px}
.ang.q{fill:var(--pick);font-style:normal;font-size:24px}
.screen{stroke:var(--ink);stroke-width:5;stroke-linecap:round}
.drop{fill:var(--glass);stroke:var(--dev);stroke-width:3}
.badge circle{fill:var(--ok)} .badge text{fill:var(--panel);font-size:16px;font-weight:800;text-anchor:middle;dominant-baseline:central;font-family:"Baloo 2",system-ui,sans-serif}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .7s ease-out forwards}
.fade{opacity:0;animation:fade .45s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
.ray.dash.fade{animation-name:fadeD}
@keyframes fadeD{to{opacity:.75}}
@media (prefers-reduced-motion: reduce){.draw,.fade,.hl,.hlr{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
@media (max-aspect-ratio: 3/4){
  h1{font-size:5vw;font-size:clamp(16px,5vw,26px);white-space:nowrap}
  .score{font-size:3.3vw;font-size:clamp(11px,3.3vw,17px);padding:.12em .55em}
  .mus{font-size:4vw;font-size:clamp(14px,4vw,20px);padding:.1em .38em}
  .hr{gap:5px}
  .opts.grow.col .btn,.opts.grow.two .btn{font-size:4.4vw;font-size:clamp(15px,4.4vw,24px)}
  .opts{grid-template-columns:1fr 1fr}
  .opts.col{grid-template-columns:1fr}
  .opts.four{grid-template-columns:repeat(4,1fr)}
  .opts.four .btn{font-size:3.4vw;font-size:clamp(12px,3.4vw,18px);padding:.25em .15em;flex-direction:column;gap:.15em}
  nav button{font-size:3.2vw;font-size:clamp(11px,3.2vw,16px)}
  .btn{font-size:3.7vw;font-size:clamp(13px,3.7vw,22px)}
  .opts.col .btn{font-size:3.6vw;font-size:clamp(13px,3.6vw,20px)}
  .card{font-size:5vw;font-size:clamp(17px,5vw,26px)}
  .pt{font-size:21px} .note{font-size:19px} .ang{font-size:22px} .ray{stroke-width:3.4}
}

:root{--clear:rgba(160,190,225,.22);--clear2:rgba(160,190,225,.32);--brine:rgba(120,170,230,.28);--acid:#FBE3E3;--base:#E1ECFB;--saltc:#E7F5EA}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--clear:rgba(160,190,225,.16);--clear2:rgba(160,190,225,.24);--brine:rgba(120,170,230,.22);--acid:#3E2326;--base:#1F2E48;--saltc:#1E3527}}
:root[data-theme="dark"]{--clear:rgba(160,190,225,.16);--clear2:rgba(160,190,225,.24);--brine:rgba(120,170,230,.22);--acid:#3E2326;--base:#1F2E48;--saltc:#1E3527}
nav{grid-template-columns:repeat(5,1fr)}
sub,sup{font-size:.68em;line-height:0}
.lbl,.cx,.q{font-variant-numeric:normal}
.card .cx{white-space:normal}
.slot{display:inline-block;min-width:2.2em;border:2px dashed var(--pick);border-radius:10px;color:var(--pick);padding:0 .3em}
.glassfill{fill:var(--clear)}
.glass{fill:none;stroke:var(--ink);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.liq{transition:fill .9s ease}
.solid{fill:#8A97A8;stroke:var(--ink);stroke-width:1}
.bub{fill:none;stroke:var(--ink);stroke-width:1.4;opacity:0;animation:rise 1.8s linear infinite}
.bubC{stroke:#9ccc65}.bubH{stroke:var(--ink)}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-95px);opacity:0}}
.strip{stroke:var(--ink);stroke-width:1.2;transition:fill .9s ease}
.dropper{fill:var(--clear2);stroke:var(--ink);stroke-width:2}
.bulb{fill:#E57373;stroke:var(--ink);stroke-width:2}
.drp{animation:drip 1.2s ease-in infinite}
@keyframes drip{0%{transform:translateY(0);opacity:1}80%{transform:translateY(54px);opacity:1}100%{transform:translateY(60px);opacity:0}}
.pt.small{font-size:13px}
.pt.big{font-size:28px}
.pt.mid{font-size:21px}
.pt.pill{font-size:15px;fill:#fff;stroke:rgba(0,0,0,.6);stroke-width:3.5px}
.phframe{fill:none;stroke:var(--ink);stroke-width:2}
.mk{fill:var(--ink);stroke:var(--ink);stroke-width:2}
.stem{stroke:var(--ink);stroke-width:2}
.hlm{fill:var(--pick);stroke:var(--pick)}
.box{stroke-width:3}
.acidbox{fill:var(--acid);stroke:#E53935}.basebox{fill:var(--base);stroke:#1E88E5}.saltbox{fill:var(--saltc);stroke:var(--ok)}
.elec{fill:#5B6573;stroke:var(--ink);stroke-width:1.5}
.wire{stroke:var(--ink);stroke-width:3}
.cryst{stroke:var(--ink);stroke-width:1;transition:fill .9s ease}
.water{fill:#64B5F6;stroke:var(--ink);stroke-width:1}
.pipe{fill:none;stroke:var(--ink);stroke-width:4;stroke-linejoin:round;opacity:.75}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opts.four{grid-template-columns:repeat(4,1fr)}
@media (max-aspect-ratio: 3/4){
  nav button{font-size:2.9vw;font-size:clamp(10px,2.9vw,15px);padding-left:2px;padding-right:2px}
  .opts.three{grid-template-columns:repeat(3,1fr)}
  .opts.four{grid-template-columns:repeat(4,1fr)}
  .opts.three .btn{font-size:3.4vw;font-size:clamp(12px,3.4vw,18px)}
  .pt.small{font-size:17px}.pt.big{font-size:32px}.pt.mid{font-size:24px}.pt.pill{font-size:19px}
}

.homeL{color:inherit;text-decoration:none;border:2px solid var(--line);border-radius:999px;padding:0 .45em;margin-right:.35em;background:var(--panel)}
.hr{display:flex;align-items:center;gap:1vmin;gap:clamp(6px,1vmin,12px)}
.mus{font:inherit;font-size:2.6vmin;font-size:clamp(16px,2.6vmin,28px);line-height:1;border:2px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);padding:.18em .55em;cursor:pointer;position:relative}
.mus[aria-pressed="false"]{opacity:.65}
.mus[aria-pressed="false"]::after{content:"";position:absolute;left:18%;right:18%;top:50%;height:3px;background:var(--bad);border-radius:3px;transform:rotate(-35deg)}
@media (max-width:520px){header>div:first-child{min-width:0;flex:1}h1{font-size:4.4vw;font-size:clamp(15px,4.4vw,24px);overflow:hidden;text-overflow:ellipsis}.hr{flex:none}.hr{gap:5px}.mus{padding:.1em .38em;font-size:4vw;font-size:clamp(14px,4vw,20px)}.score{font-size:3.4vw;font-size:clamp(11px,3.4vw,17px);padding:.12em .55em}h1 span{display:none}header{gap:6px}}
.cf{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;pointer-events:none;z-index:80}
.cf i{position:absolute;top:-4vmin;display:block;border-radius:2px;animation:cfall var(--d) ease-in-out var(--dl) forwards;opacity:0}
@keyframes cfall{0%{opacity:1;transform:translate3d(0,0,0) rotate3d(1,1,.3,0deg)}25%{transform:translate3d(calc(var(--sx)*-.6),28vh,0) rotate3d(1,1,.3,calc(var(--r)*.25))}50%{transform:translate3d(var(--sx),56vh,0) rotate3d(1,1,.3,calc(var(--r)*.5))}75%{transform:translate3d(calc(var(--sx)*-.4),84vh,0) rotate3d(1,1,.3,calc(var(--r)*.75))}88%{opacity:1}100%{opacity:0;transform:translate3d(calc(var(--sx)*.5),112vh,0) rotate3d(1,1,.3,var(--r))}}
.big3{position:fixed;left:50%;top:1.2vmin;top:clamp(4px,1.2vmin,14px);z-index:90;pointer-events:none;transform:translateX(-50%);white-space:nowrap;font-weight:800;font-size:5vmin;font-size:clamp(20px,5vmin,52px);color:#fff;
 background:linear-gradient(100deg,var(--c1),var(--c3),var(--c2));border-radius:999px;padding:.2em .9em;box-shadow:0 6px 24px rgba(0,0,0,.28);animation:b3 2.2s ease-out forwards}
@keyframes b3{0%{opacity:0;transform:translateX(-50%) scale(.5)}12%{opacity:1;transform:translateX(-50%) scale(1.12)}22%{transform:translateX(-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-14px) scale(1)}}
@media (prefers-reduced-motion: reduce){.big3{animation:b3r 2.2s linear forwards}@keyframes b3r{0%,80%{opacity:1}100%{opacity:0}}}
.next{position:relative;overflow:hidden}
.next.cd::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:#FACC15;transform-origin:left;animation:cdw var(--t,2500ms) linear forwards}
@keyframes cdw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style>

<div class="app">
  <header>
    <div>

    const box=document.createElement("div");box.className="cf";

/* formula formatter: H2SO4 -> H<sub>2</sub>SO<sub>4</sub>, H^+ -> H<sup>+</sup> */
const F=s=>String(s).replace(/\^([0-9]*[+−-])/g,"<sup>$1</sup>").replace(/([A-Za-z\)])(\d+)/g,"$1<sub>$2</sub>").replace(/·½/g,"·½");
const NS="http://www.w3.org/2000/svg";
function el(tag,attrs,parent,text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;if(parent)parent.appendChild(e);return e;}

/* svg text with real subscripts */
function ftxt(svg,x,y,s,cls){
  const t=el("text",{x,y,class:cls||"pt"},svg);
  const parts=String(s).split(/(\^[0-9]*[+−-]|(?<=[A-Za-z\)])\d+)/).filter(Boolean);
  for(const p of parts){
    if(p[0]==="^"){el("tspan",{"baseline-shift":"super","font-size":"68%"},t,p.slice(1));}
    else if(/^\d+$/.test(p)&&t.lastChild&&/[A-Za-z\)]$/.test(t.lastChild.textContent)){el("tspan",{"baseline-shift":"sub","font-size":"68%"},t,p);}
    else el("tspan",{},t,p);
  }
  return t;
}
const COL={"Red":"#E53935","Blue":"#1E88E5","Pink":"#EC4899","Yellow":"#F6C915","Purple":"#8E44AD","Colourless":"transparent","Reddish-brown":"#A0522D","Orange":"#FB8C00","Green":"#43A047","White":"#F4F4F4","Milky white":"#EDEDED","Blue-green":"#1FA39A"};

function makeGame(id,FIRST,MORE,draw){

  const q=s=>sec.querySelector(s);

  const ALL=[...FIRST.map((x,i)=>Object.assign({},x,{src:(x.src||"📘 Textbook")+" · "+(i+1)+" of "+NC})),...MORE.map((x,i)=>Object.assign({},x,{src:"⭐ Bonus "+(i+1)+" of "+NB}))];
  const nx=bag(ALL.map((_,i)=>i));let seq=0,cur=null,autoT=null;
  function show(){

    const card=typeof it.card==="function"?it.card(cur.state):it.card;

  }

    UI.tag.textContent=cur.src;UI.tag.classList.toggle("think",cur.src.startsWith("💡")||cur.src.startsWith("⭐"));
    UI.q.innerHTML=F(cur.q);

      if(cur!==mine)return;

    };

    if(!ok)b.classList.add("bad");

function tube(svg,x,o){

}

function drawPh(it,svg,S){
  const sc=it.sc;if(!sc)return false;
  if(sc.order){
    const shown=sc.always?sc.order:sc.order.filter(o=>S.answered||S.done.has(o[2]));
    phBar(svg,shown.map(o=>[o[0],o[1]]),{rows:true});return true;
  }
  if(sc.reveal&&!S.answered){phBar(svg,[]);txt(svg,320,90,"Where on the scale?","pt q");return true;}
  phBar(svg,sc.marks.map(m=>[m[0],sc.nolabel?(S.answered?"pH "+m[0]:"?"):m[1]]),{rows:sc.rows||sc.marks.length>3});
  return true;
}
