<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Play and Learn – Chemical Reactions and Equations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>/*css-fallbacks*/
:root{
  --bg:#EEF0F7; --panel:#FFFFFF; --ink:#1D2340; --muted:#5D6485; --line:#CDD2E4;
  --cold:#2459C9; --cold-soft:#DDE6FB; --hot:#C2410C; --hot-soft:#FCE4D6;
  --qc:#B91C1C;--ok:#1E8F50; --ok-soft:#D7F2E2; --bad:#C63B3B; --bad-soft:#F8DCDC;
  --tab:#D9DDEE; --accent:#1D2340; --accent-ink:#FFFFFF; --pick:#7C3AED;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12152A; --panel:#1C2038; --ink:#E8EAF6; --muted:#A3A9C9; --line:#323858;
    --cold:#86A8F5; --cold-soft:#1F2C55; --hot:#F59E6B; --hot-soft:#40261A;
    --qc:#FF8A8A;--ok:#5BD08F; --ok-soft:#173A27; --bad:#F07A7A; --bad-soft:#442022;
    --tab:#272C4A; --accent:#E8EAF6; --accent-ink:#12152A; --pick:#B49AFB;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12152A; --panel:#1C2038; --ink:#E8EAF6; --muted:#A3A9C9; --line:#323858;
  --cold:#86A8F5; --cold-soft:#1F2C55; --hot:#F59E6B; --hot-soft:#40261A;
  --qc:#FF8A8A;--ok:#5BD08F; --ok-soft:#173A27; --bad:#F07A7A; --bad-soft:#442022;
  --tab:#272C4A; --accent:#E8EAF6; --accent-ink:#12152A; --pick:#B49AFB;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Baloo 2",system-ui,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
.app{height:100%;display:flex;flex-direction:column;padding:1.4vmin;padding:clamp(6px,1.4vmin,16px);gap:1.2vmin;gap:clamp(6px,1.2vmin,12px);max-width:1400px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.school{font-size:2vmin;font-size:clamp(12px,2vmin,20px);font-weight:700;color:var(--muted);line-height:1.1;margin-bottom:2px}
h1{margin:0;font-size:3.6vmin;font-size:clamp(20px,3.6vmin,40px);font-weight:800;line-height:1;letter-spacing:-.01em}
h1 span{font-weight:600;color:var(--muted);font-size:.6em;margin-left:.4em}
.score{transform-origin:right center;font-size:2.4vmin;font-size:clamp(14px,2.4vmin,26px);font-weight:700;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:.15em .8em;white-space:nowrap}
.hr{display:flex;align-items:center;gap:1vmin;gap:clamp(6px,1vmin,12px)}
.mus{font:inherit;font-size:2.6vmin;font-size:clamp(16px,2.6vmin,28px);line-height:1;border:2px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);padding:.18em .55em;cursor:pointer;position:relative}
.mus[aria-pressed="false"]{opacity:.65}
.mus[aria-pressed="false"]::after{content:"";position:absolute;left:18%;right:18%;top:50%;height:3px;background:var(--bad);border-radius:3px;transform:rotate(-35deg)}
header>div:first-child{min-width:0}
@media (max-width:520px){h1 span{display:none}.hr{gap:6px}.mus{padding:.12em .42em}.score{font-size:3.7vw;font-size:clamp(12px,3.7vw,17px);padding:.12em .6em}}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:.8vmin;gap:clamp(4px,.8vmin,10px)}
nav button{font:inherit;font-weight:700;font-size:2.2vmin;font-size:clamp(12px,2.2vmin,22px);line-height:1.1;border:0;border-radius:12px;background:var(--tab);color:var(--ink);padding:1.1vmin 4px;padding:clamp(6px,1.1vmin,12px) 4px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
main{flex:1;min-height:0;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:2vmin;padding:clamp(10px,2vmin,24px);display:flex;flex-direction:column;overflow:hidden}
.game{display:none;flex:1;min-height:0;flex-direction:column;gap:1.4vmin;gap:clamp(8px,1.4vmin,14px)}
.game.on{display:flex}
.pic{flex:1.3;min-height:0;display:flex;justify-content:center;align-items:center;position:relative}
.pic[hidden]{display:none}
.pic svg{position:absolute;top:0;left:0;right:0;bottom:0;margin:auto;width:100%;height:100%;max-width:1100px;display:block}/*panel-fix*/@media (min-height:500px){.pic{min-height:80px}}
.game.haspic .opts{flex:0 0 auto;grid-auto-rows:minmax(7.5vmin,auto);grid-auto-rows:minmax(clamp(44px,7.5vmin,86px),auto)}
.game.haspic .q{margin-bottom:0}
.pt{fill:var(--ink);font-size:16px;font-weight:800;text-anchor:middle;font-family:"Baloo 2",system-ui,sans-serif;paint-order:stroke;stroke:var(--panel);stroke-width:5px;stroke-linejoin:round}
.pt.small{font-size:15px}.pt.big{font-size:28px}.pt.mid{font-size:21px}
@media (orientation:portrait) and (max-height:720px){
  .game.haspic .opts{gap:6px}
  .game.haspic .opts button{padding:5px 9px;font-size:15px;line-height:1.15}
  .game.haspic .q{font-size:18px}
}
@media (orientation:landscape) and (max-height:560px){
  .game.on.haspic{display:grid;grid-template-columns:1.1fr 1fr;grid-template-rows:auto auto minmax(0,1fr) auto;column-gap:2vw;column-gap:clamp(8px,2vw,20px);
    grid-template-areas:"tag tag" "q q" "pic opts" "foot foot"}
  .game.haspic>.tag{grid-area:tag;justify-self:center}.game.haspic>.q{grid-area:q}.game.haspic>.pic{grid-area:pic}
  .game.haspic>.opts{grid-area:opts;grid-template-columns:1fr;align-content:center;grid-auto-rows:auto;gap:6px;min-height:0}
  .game.haspic>.opts button{min-height:0;padding:5px 10px;font-size:3.9vh;font-size:clamp(14px,3.9vh,24px);line-height:1.15}
  .game.haspic>.q{font-size:4.8vh;font-size:clamp(16px,4.8vh,32px);margin:0}.game.haspic>.foot{grid-area:foot}
  .game.haspic>.eqshow{display:none}
}

.q{font-size:3.9vmin;font-size:clamp(19px,3.9vmin,42px);font-weight:800;line-height:1.15;text-align:center;margin:0 0 1.4vmin;margin:0 0 clamp(6px,1.4vmin,16px);color:var(--qc)}
#bal{justify-content:center}#bal .q{margin-top:auto}#bal .stage{flex:0 0 auto!important;min-height:auto;padding:1vmin 0;padding:clamp(4px,1vmin,12px) 0}#bal .panel{width:100%;width:min(100%,900px);margin:0 auto}#bal .atoms{margin-bottom:auto}#bal .foot{margin-top:0}
.hint{text-align:center;font-size:2.3vmin;font-size:clamp(13px,2.3vmin,24px);color:var(--muted);font-weight:600;margin:-.3em 0 0}
sub{font-size:.62em;vertical-align:-.25em;line-height:0}
.t{white-space:nowrap}
.op{color:var(--muted);font-weight:700}

/* equation display */
.eqshow{font-size:6vmin;font-size:clamp(24px,6vmin,68px);font-weight:800;text-align:center;line-height:1.3;margin:0}
.opts{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:1.4vmin;gap:clamp(8px,1.4vmin,14px)}
.btn{font:inherit;font-weight:700;color:var(--ink);background:var(--bg);border:3px solid var(--line);border-radius:16px;cursor:pointer;font-size:4.4vmin;font-size:clamp(19px,4.4vmin,48px);line-height:1.15;padding:.25em .35em;min-height:0;display:flex;align-items:center;justify-content:center;text-align:center}
.btn .lbl{display:inline-block}
.btn .lbl.one{white-space:nowrap}
.opts.eqs .btn{font-size:3.4vmin;font-size:clamp(16px,3.4vmin,37px)}
.btn.ok{background:var(--ok-soft);border-color:var(--ok)}
.btn.bad{background:var(--bad-soft);border-color:var(--bad)}
.btn:disabled{cursor:default}
.foot{display:flex;align-items:center;gap:10px;min-height:7vmin;min-height:clamp(40px,7vmin,70px)}
.msg{flex:1;font-size:2.8vmin;font-size:clamp(14px,2.8vmin,29px);font-weight:600;line-height:1.2}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.next{font:inherit;font-weight:800;font-size:3vmin;font-size:clamp(16px,3vmin,32px);border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);padding:.35em 1.1em;cursor:pointer;white-space:nowrap}
.next.soft{background:var(--tab);color:var(--ink)}
[hidden]{display:none!important}
.next{position:relative;overflow:hidden}
.next.auto::after{content:"";position:absolute;left:0;bottom:0;height:5px;width:100%;background:currentColor;opacity:.55;transform-origin:left;animation:drain var(--t,3s) linear forwards}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.tag{align-self:center;font-size:2.1vmin;font-size:clamp(12px,2.1vmin,21px);font-weight:700;color:var(--cold);border:2px solid var(--cold);border-radius:999px;padding:0 .8em;white-space:nowrap;margin-bottom:-.3em}
.tag.think{color:var(--pick);border-color:var(--pick)}
.eqshow.cardline{font-size:4.3vmin;font-size:clamp(19px,4.3vmin,46px);background:var(--bg);border-radius:16px;padding:.15em .6em;align-self:center;line-height:1.2}
.eqshow.cardline .ic{font-size:1.2em}
.opts.txt .btn{font-size:3.4vmin;font-size:clamp(17px,3.4vmin,37px)}
.opts.col{grid-template-columns:1fr}
.opts.col .btn{font-size:3.1vmin;font-size:clamp(16px,3.1vmin,33px);justify-content:flex-start;text-align:left;padding:.2em .7em}
.opts.three{grid-template-columns:repeat(3,1fr)}
button:focus-visible{outline:3px solid var(--pick);outline-offset:2px}

/* balance */
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.eqrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.3em .35em;font-size:5.2vmin;font-size:clamp(22px,5.2vmin,58px);font-weight:800;line-height:1.2}
.term{display:inline-flex;align-items:center;gap:.12em;white-space:nowrap}
.cbox{font:inherit;font-size:.9em;width:1.3em;height:1.45em;border:3px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.cbox.sel{border-color:var(--pick);box-shadow:0 0 0 3px var(--pick)}
.cbox:disabled{cursor:default;border-style:dashed}
.name{font-size:.55em;font-weight:700;color:var(--muted);border:2px dashed var(--line);border-radius:10px;padding:.15em .45em;white-space:nowrap}
.name.cur{border:3px solid var(--pick);color:var(--ink)}
.filled{border-radius:10px;padding:0 .1em;background:var(--ok-soft)}
.panel{display:flex;flex-direction:column;gap:1vmin;gap:clamp(6px,1vmin,10px)}
.panel p{margin:0;text-align:center;font-size:3.2vmin;font-size:clamp(16px,3.2vmin,34px);font-weight:700}
.strip{display:grid;grid-template-columns:repeat(9,1fr);gap:.9vmin;gap:clamp(4px,.9vmin,10px)}
.num{font:inherit;font-weight:800;font-size:4.4vmin;font-size:clamp(20px,4.4vmin,48px);border:3px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);cursor:pointer;padding:.1em 0;line-height:1.2}
.num:active{background:var(--tab)}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2vmin;gap:clamp(6px,1.2vmin,12px)}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2vmin;gap:clamp(6px,1.2vmin,12px)}
.row3 .btn,.row4 .btn{padding:.35em .2em;font-size:3.9vmin;font-size:clamp(18px,3.9vmin,44px)}
.row4 .btn{font-size:2.9vmin;font-size:clamp(15px,2.9vmin,30px)}
.atoms{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.9vmin;gap:clamp(4px,.9vmin,10px);font-size:2.8vmin;font-size:clamp(14px,2.8vmin,30px)}
.atoms .cap{color:var(--muted);font-weight:600}
.ac{display:inline-flex;gap:.45em;align-items:center;border:2px solid;border-radius:10px;padding:.05em .55em;font-weight:700;white-space:nowrap}
.ac b{font-weight:800}
.ac.ok{border-color:var(--ok);background:var(--ok-soft)} .ac.no{border-color:var(--bad);background:var(--bad-soft)}

/* sort */
.tray{display:grid;grid-template-columns:repeat(4,1fr);gap:1.1vmin;gap:clamp(6px,1.1vmin,12px)}
.chip{font-weight:700;font-size:2.8vmin;font-size:clamp(14px,2.8vmin,29px);line-height:1.15;text-align:center;background:var(--bg);border:3px solid var(--line);border-radius:14px;padding:.45em .3em;cursor:grab;touch-action:none;display:flex;align-items:center;justify-content:center;min-height:3.2em}
.chip.sel{border-color:var(--pick);box-shadow:0 0 0 3px var(--pick) inset}
.chip.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
.ghost{position:fixed;pointer-events:none;z-index:50;opacity:.92;transform:translate(-50%,-50%) scale(1.05);box-shadow:0 10px 24px rgba(0,0,0,.25);margin:0}
.bins{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:1.4vmin;gap:clamp(8px,1.4vmin,16px)}
.bin{border:3px dashed;border-radius:18px;padding:1.1vmin;padding:clamp(6px,1.1vmin,12px);display:flex;flex-direction:column;gap:6px;min-height:0;cursor:pointer;overflow:hidden}
.bin.x{border-color:var(--hot);background:var(--hot-soft)} .bin.n{border-color:var(--cold);background:var(--cold-soft)}
.bin.hover{border-style:solid}
.bin h3{margin:0;font-size:3.5vmin;font-size:clamp(17px,3.5vmin,37px);line-height:1.1;text-align:center}
.bin.x h3{color:var(--hot)} .bin.n h3{color:var(--cold)}
.bin p{margin:0;text-align:center;font-size:2.1vmin;font-size:clamp(12px,2.1vmin,21px);color:var(--muted);font-weight:600}
.bin .in{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:stretch;gap:1vmin;gap:clamp(5px,1vmin,10px);overflow:hidden}
.bin .in span{background:var(--panel);border:2.5px solid currentColor;border-radius:14px;padding:.4em .6em;font-weight:800;font-size:2.9vmin;font-size:clamp(14px,2.9vmin,30px);line-height:1.15;text-align:center;color:var(--ink);width:100%;box-sizing:border-box}
.bin.x .in span{border-color:var(--hot)}.bin.n .in span{border-color:var(--cold)}

@media (prefers-reduced-motion: reduce){.chip.shake{animation:none}}
@media (max-aspect-ratio: 3/4){
  .tray{grid-template-columns:repeat(2,1fr)}
  nav button{font-size:3vw;font-size:clamp(11px,3vw,16px)}
  .row4{grid-template-columns:1fr 1fr}
  .opts.txt .btn{font-size:4.5vw;font-size:clamp(15px,4.5vw,25px)}
  .opts.col .btn{font-size:4.2vw;font-size:clamp(14px,4.2vw,23px)}
  .opts.three{grid-template-columns:repeat(3,1fr)}
  .opts.three .btn{font-size:4vw;font-size:clamp(14px,4vw,22px)}
  nav button{font-size:2.9vw;font-size:clamp(10px,2.9vw,15px)}
}
/* ===== colourful theme ===== */
:root{
  --c1:#F97316;--c2:#2563EB;--c3:#DB2777;--c4:#DC2626;--c5:#0D9488;
  --s1:#FFEDD5;--s2:#DBEAFE;--s3:#FCE7F3;--s4:#FEE2E2;--s5:#CCFBF1;
  --t1:#FEF3C7;--b1:#F59E0B;--t2:#E0F2FE;--b2:#0EA5E9;--t3:#FCE7F3;--b3:#EC4899;--t4:#DCFCE7;--b4:#22C55E;
  --on:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --c1:#FB923C;--c2:#60A5FA;--c3:#F472B6;--c4:#F87171;--c5:#2DD4BF;
    --s1:#3B2412;--s2:#16264A;--s3:#3B1530;--s4:#3E1A1A;--s5:#0F3532;
    --t1:#3A2E0E;--b1:#FBBF24;--t2:#0C2F44;--b2:#38BDF8;--t3:#3B1430;--b3:#F472B6;--t4:#12351F;--b4:#4ADE80;
    --on:#12152A;
  }
}
:root[data-theme="dark"]{
  --c1:#FB923C;--c2:#60A5FA;--c3:#F472B6;--c4:#F87171;--c5:#2DD4BF;
  --s1:#3B2412;--s2:#16264A;--s3:#3B1530;--s4:#3E1A1A;--s5:#0F3532;
  --t1:#3A2E0E;--b1:#FBBF24;--t2:#0C2F44;--b2:#38BDF8;--t3:#3B1430;--b3:#F472B6;--t4:#12351F;--b4:#4ADE80;
  --on:#12152A;
}
body[data-g="bal"]{--c:var(--c1);--s:var(--s1)}
body[data-g="typ"]{--c:var(--c2);--s:var(--s2)}
body[data-g="rdx"]{--c:var(--c3);--s:var(--s3)}
body[data-g="heat"]{--c:var(--c4);--s:var(--s4)}
body[data-g="obs"]{--c:var(--c5);--s:var(--s5)}
body{background:linear-gradient(160deg,var(--s) 0%,var(--bg) 55%,var(--bg) 100%)}
h1{background:linear-gradient(90deg,var(--c1),var(--c3),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
h1 span{color:var(--muted);-webkit-text-fill-color:var(--muted)}
.score{border-color:var(--c);color:var(--c);border-width:3px}
.score.pop{animation:pop .45s}
@keyframes pop{50%{transform:scale(1.2)}}
nav button[data-g="bal"]{background:var(--s1);color:var(--c1)}
nav button[data-g="typ"]{background:var(--s2);color:var(--c2)}
nav button[data-g="rdx"]{background:var(--s3);color:var(--c3)}
nav button[data-g="heat"]{background:var(--s4);color:var(--c4)}
nav button[data-g="obs"]{background:var(--s5);color:var(--c5)}
nav button[aria-selected="true"]{background:var(--c);color:var(--on);box-shadow:0 4px 0 rgba(0,0,0,.18)}
nav button{border:2px solid transparent}
main{border:3px solid var(--c);box-shadow:0 6px 0 var(--s)}
.tag{color:var(--c);border-color:var(--c);background:var(--s)}
.tag.think{color:var(--pick);border-color:var(--pick)}
.eqshow.cardline{background:var(--s)}
.next{background:var(--c);color:var(--on)}
.next.soft{background:var(--tab);color:var(--ink)}
.name.cur,.cbox.sel{border-color:var(--c);box-shadow:0 0 0 3px var(--c)}
.opts .btn:nth-child(4n+1),.row3 .btn:nth-child(4n+1),.row4 .btn:nth-child(4n+1){background:var(--t1);border-color:var(--b1)}
.opts .btn:nth-child(4n+2),.row3 .btn:nth-child(4n+2),.row4 .btn:nth-child(4n+2){background:var(--t2);border-color:var(--b2)}
.opts .btn:nth-child(4n+3),.row3 .btn:nth-child(4n+3),.row4 .btn:nth-child(4n+3){background:var(--t3);border-color:var(--b3)}
.opts .btn:nth-child(4n+4),.row4 .btn:nth-child(4n+4){background:var(--t4);border-color:var(--b4)}
.btn{box-shadow:0 4px 0 rgba(0,0,0,.08);transition:transform .08s}
.btn:not(:disabled):active{transform:translateY(2px)}
.opts .btn.ok,.row3 .btn.ok,.row4 .btn.ok,.btn.ok{background:var(--ok-soft);border-color:var(--ok);border-width:4px}
.opts .btn.bad,.row3 .btn.bad,.row4 .btn.bad,.btn.bad{background:var(--bad-soft);border-color:var(--bad)}
.opts .btn:disabled:not(.ok):not(.bad){opacity:.5}
.btn.ok::before{content:"✅ "}
@media (max-width:380px) and (max-height:680px){.opts.txt .btn{font-size:13px!important;line-height:1.05;padding:.08em .3em}}
.num:nth-child(3n+1){border-color:var(--b1)}.num:nth-child(3n+2){border-color:var(--b2)}.num:nth-child(3n+3){border-color:var(--b3)}
.chip:nth-child(4n+1){background:var(--t1);border-color:var(--b1)}
.chip:nth-child(4n+2){background:var(--t2);border-color:var(--b2)}
.chip:nth-child(4n+3){background:var(--t3);border-color:var(--b3)}

<script>
(function(){
  const $=id=>document.getElementById(id);
  const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
  const pick=(a,k)=>shuffle(a).slice(0,k);
  const one=a=>a[Math.random()*a.length|0];
  const fx=f=>f.replace(/([A-Za-z)])(\d+)/g,"$1<sub>$2</sub>");
  const tokH=tok=>tok==="+"?'<span class="op">+</span>':tok==="→"?'<span class="op">→</span>':`<span class="t">${tok.replace(/^(\d*)(.+)$/,(m,c,f)=>c+fx(f))}</span>`;
  const eqH=s=>s.split(" ").map(tokH).join(" ");
  let right=0,total=0;
  let lastX=innerWidth/2,lastY=innerHeight/2,streak=0;
  const pt=e=>{lastX=e.clientX;lastY=e.clientY;};
  document.addEventListener("pointerdown",pt,true);document.addEventListener("pointerup",pt,true);
  const RM=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- sound: soft background music + small effects (Web Audio, no files) ----------
  const Snd=(()=>{
    let ctx=null,mg=null,sg=null,on=true,tm=null,nt=0,st=0;
    try{on=localStorage.getItem("zphsRLmusic")!=="off";}catch(e){}
    const CH=[[261.63,329.63,392.0],[220.0,261.63,329.63],[174.61,220.0,261.63],[196.0,246.94,293.66]];
    const PEN=[523.25,587.33,659.25,783.99,880.0];
    const EIGHTH=60/84/2;
    function tone(f,t,d,type,v,dest){
      const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+0.05);
    }
    function sched(){
      if(!ctx||!on)return;
      while(nt<ctx.currentTime+0.35){
        const bar=((st/8)|0)%4,k=st%8,ch=CH[bar];
        tone(ch[[0,1,2,1,0,1,2,1][k]],nt,0.55,"triangle",0.5,mg);
        if(k===0)tone(ch[0]/2,nt,1.5,"sine",0.55,mg);
        if((k===2||k===6)&&Math.random()<0.55)tone(PEN[(Math.random()*PEN.length)|0],nt+0.02,0.7,"sine",0.28,mg);
        nt+=EIGHTH;st=(st+1)%32;
      }
    }
    function startLoop(){
      if(tm||!ctx)return;
      nt=ctx.currentTime+0.1;st=0;
      mg.gain.cancelScheduledValues(ctx.currentTime);mg.gain.setTargetAtTime(0.085,ctx.currentTime,0.4);
      tm=setInterval(sched,120);sched();
    }
    function stopLoop(){
      clearInterval(tm);tm=null;
      if(ctx&&mg){mg.gain.cancelScheduledValues(ctx.currentTime);mg.gain.setTargetAtTime(0.0001,ctx.currentTime,0.12);}
    }
    function init(){
      if(ctx)return true;
      const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
      try{
        ctx=new AC();mg=ctx.createGain();mg.gain.value=0.0001;sg=ctx.createGain();sg.gain.value=0.5;
        const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=1800;
        mg.connect(lp);lp.connect(ctx.destination);sg.connect(ctx.destination);
      }catch(e){ctx=null;return false;}
      return true;
    }
    const api={
      start(){if(!init())return;if(ctx.state==="suspended")ctx.resume();if(on)startLoop();},
      toggle(){
        on=!on;try{localStorage.setItem("zphsRLmusic",on?"on":"off");}catch(e){}
        if(on){if(init()){if(ctx.state==="suspended")ctx.resume();startLoop();}}else stopLoop();
        return on;
      },
      isOn:()=>on,
      pause(){if(ctx&&ctx.state==="running")ctx.suspend();},
      resume(){if(ctx&&on&&ctx.state==="suspended")ctx.resume();},
      ok(){if(!ctx||!on)return;const t=ctx.currentTime;tone(880,t,0.22,"sine",0.5,sg);tone(1318.5,t+0.09,0.3,"sine",0.45,sg);},
      fan(){if(!ctx||!on)return;const t=ctx.currentTime;[523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>tone(f,t+i*0.09,0.5,"triangle",0.5,sg));tone(1568,t+0.5,0.8,"sine",0.35,sg);}
    };
    return api;
  })();
  const musB=$("mus");
  const musSync=()=>{musB.setAttribute("aria-pressed",Snd.isOn());};musSync();
  musB.addEventListener("click",e=>{e.stopPropagation();Snd.toggle();musSync();});
  const firstTouch=()=>{Snd.start();};
  document.addEventListener("pointerdown",firstTouch,{capture:true,once:true});
  document.addEventListener("keydown",firstTouch,{capture:true,once:true});
  document.addEventListener("visibilitychange",()=>{document.hidden?Snd.pause():Snd.resume();});

  // ---------- 3 in a row: confetti rain + banner ----------
  function glitter(){/* tiny shiny glitter that twinkles, spins and drifts down */
    if(!document.getElementById("glCss")){const st=document.createElement("style");st.id="glCss";st.textContent=`
.cf i.gl{opacity:1;position:absolute;top:-3vh;border-radius:1px;box-shadow:0 0 4px var(--c),0 0 10px var(--c);animation:glFall var(--d) cubic-bezier(.35,.1,.65,1) var(--dl) both,glTw var(--tw) ease-in-out var(--dl) infinite alternate;will-change:transform,opacity}
.cf i.gl.dot{border-radius:50%}
.cf i.gl.star{-webkit-clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);box-shadow:none}
@keyframes glFall{0%{transform:translate3d(0,0,0) rotate(0deg) rotateY(0deg)}25%{transform:translate3d(calc(var(--sx)*.5),28vh,0) rotate(calc(var(--r)*.25)) rotateY(360deg)}50%{transform:translate3d(calc(var(--sx)*-.2),56vh,0) rotate(calc(var(--r)*.5)) rotateY(720deg)}75%{transform:translate3d(calc(var(--sx)*.7),84vh,0) rotate(calc(var(--r)*.75)) rotateY(1080deg)}100%{transform:translate3d(var(--sx),110vh,0) rotate(var(--r)) rotateY(1440deg)}}
@keyframes glTw{0%{opacity:1;filter:brightness(1.7)}50%{opacity:.45;filter:brightness(.85)}100%{opacity:1;filter:brightness(2.1)}}`;document.head.appendChild(st);}
    const box=document.createElement("div");box.className="cf";
    const cols=[["#FACC15","#FEF9C3"],["#CBD5E1","#FFFFFF"],["#F472B6","#FCE7F3"],["#22D3EE","#CFFAFE"],["#A78BFA","#EDE9FE"],["#4ADE80","#DCFCE7"],["#FB923C","#FFEDD5"],["#60A5FA","#DBEAFE"]];
    for(let k=0;k<90;k++){const p=document.createElement("i"),c=cols[k%cols.length],t=Math.random();
      const w=t<.35?7+Math.random()*4:t<.65?7+Math.random()*4:14+Math.random()*7;
      p.className="gl "+(t<.35?"sq":t<.65?"dot":"star");
      p.style.cssText="left:"+(Math.random()*100).toFixed(1)+"%;width:"+w.toFixed(1)+"px;height:"+w.toFixed(1)+"px;--c:"+c[0]+";background:linear-gradient(135deg,"+c[0]+" 0%,"+c[1]+" 45%,"+c[0]+" 62%,"+c[0]+" 100%);--d:"+(4.5+Math.random()*2).toFixed(2)+"s;--dl:"+(Math.random()*1.4).toFixed(2)+"s;--sx:"+((Math.random()-.5)*16).toFixed(1)+"vw;--r:"+((Math.random()<.5?-1:1)*(360+Math.random()*720)|0)+"deg;--tw:"+(.25+Math.random()*.5).toFixed(2)+"s";
      box.appendChild(p);}
    document.body.appendChild(box);setTimeout(()=>box.remove(),9000);
  }
  function celebrate(n){
    const old=document.querySelector(".big3");if(old)old.remove();
    const b=document.createElement("div");b.className="big3";b.textContent=`🔥 ${n} in a row!`;document.body.appendChild(b);setTimeout(()=>b.remove(),2300);
    glitter();
  }
  function banner(t){
    const old=document.querySelector(".big3");if(old)old.remove();
    const b=document.createElement("div");b.className="big3";b.textContent=t;document.body.appendChild(b);setTimeout(()=>b.remove(),2300);
  }
  const mark=ok=>{
    total++;if(ok){right++;streak++;}else streak=0;
    const s=$("score");s.textContent=`Score ${right} / ${total}`+(streak>=3?` 🔥${streak}`:"");
    if(!ok)return;
    if(streak%3===0&&!window.__qcf){celebrate(streak);Snd.fan();}else Snd.ok();
    s.classList.remove("pop");void s.offsetWidth;s.classList.add("pop");
    if(RM)return;
    for(let k=0;k<8;k++){
      const p=document.createElement("span");p.className="spark";p.textContent=["⭐","✨","🎉","🌟"][k%4];
      const a=k/8*Math.PI*2;p.style.left=lastX+"px";p.style.top=lastY+"px";
      p.style.setProperty("--dx",Math.round(Math.cos(a)*80)+"px");p.style.setProperty("--dy",Math.round(Math.sin(a)*80-30)+"px");
      document.body.appendChild(p);setTimeout(()=>p.remove(),950);
    }
  };
  const setMsg=(id,cls,html)=>{const m=$(id);m.className="msg"+(cls?" "+cls:"");m.innerHTML=html;};

  document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>{
    document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-selected",x===b));
    document.querySelectorAll(".game").forEach(g=>g.classList.toggle("on",g.id===b.dataset.g));
    document.body.dataset.g=b.dataset.g;
    rearm();
  }));

  function quiz(box,items,isRight,label,onDone,oneLine,noMark){
    box.innerHTML="";
    items.forEach(it=>{
      const b=document.createElement("button");b.className="btn";
      b.innerHTML=`<span class="lbl${oneLine?" one":""}">${label(it)}</span>`;b._it=it;
      b.onclick=()=>{
        const ok=isRight(it);if(!noMark)mark(ok);
        box.querySelectorAll("button").forEach(x=>{x.disabled=true;if(isRight(x._it))x.classList.add("ok");});
        if(!ok)b.classList.add("bad");
        onDone(ok);
      };
      box.appendChild(b);
    });
  }

  // ---------- chemistry helpers ----------
  function atoms(f){
    let i=0;
    const num=()=>{let s="";while(i<f.length&&/\d/.test(f[i]))s+=f[i++];return s?+s:1;};
    const group=()=>{
      const m={};
      while(i<f.length&&f[i]!==")"){
        if(f[i]==="("){i++;const g=group();i++;const n=num();for(const k in g)m[k]=(m[k]||0)+g[k]*n;}
        else{let el=f[i++];while(i<f.length&&/[a-z]/.test(f[i]))el+=f[i++];const n=num();m[el]=(m[el]||0)+n;}
      }
      return m;
    };
    return group();
  }
  function tally(eq,c){
    const L={},R={},order=[];
    eq.r.forEach((f,i)=>{const a=atoms(f);for(const k in a){if(!order.includes(k))order.push(k);L[k]=(L[k]||0)+a[k]*c[i];}});
    eq.p.forEach((f,j)=>{const a=atoms(f);for(const k in a){if(!order.includes(k))order.push(k);R[k]=(R[k]||0)+a[k]*c[eq.r.length+j];}});
    return order.map(k=>({el:k,l:L[k]||0,r:R[k]||0}));
  }
  const gcd=(a,b)=>b?gcd(b,a%b):a;
  function solve(eq){
    const n=eq.r.length+eq.p.length;let best=null,bs=1e9;const c=new Array(n).fill(1);
    const rec=k=>{
      if(k===n){const s=c.reduce((a,b)=>a+b,0);if(s<bs&&tally(eq,c).every(x=>x.l===x.r)){bs=s;best=c.slice();}return;}
      for(let v=1;v<=9;v++){c[k]=v;if(c.reduce((a,b)=>a+b,0)>=bs)break;rec(k+1);}
      c[k]=1;
    };
    rec(0);return best;
  }
  const balStr=eq=>{const c=eq.c,nr=eq.r.length;const t=(f,i)=>(c[i]>1?c[i]:"")+f;
    return eq.r.map((f,i)=>t(f,i)).join(" + ")+" → "+eq.p.map((f,j)=>t(f,nr+j)).join(" + ");};

  // ---------- formula choices for word equations ----------
  const NAME={

    "Aluminium sulphate":["Al2(SO4)3","Al3(SO4)2","AlSO4"],"Barium sulphate":["BaSO4","Ba2SO4","Ba(SO4)2"],
    "Aluminium chloride":["AlCl3","AlCl","Al3Cl"],"Silver nitrate":["AgNO3","Ag(NO3)2","Ag2NO3"],
    "Silver chloride":["AgCl","AgCl2","SiCl"],"Zinc nitrate":["Zn(NO3)2","ZnNO3","Zn2NO3"],
    "Copper chloride":["CuCl2","CuCl","Cu2Cl"],"Copper oxide":["CuO","CuO2","Cu2O"],
    "Potassium sulphate":["K2SO4","KSO4","K(SO4)2"],"Potassium chloride":["KCl","KCl2","K2Cl"],
    "Potassium bromide":["KBr","KBr2","PBr"],"Barium iodide":["BaI2","BaI","Ba2I"],"Potassium iodide":["KI","KI2","K2I"],
    "Barium bromide":["BaBr2","BaBr","Ba2Br"],"Zinc carbonate":["ZnCO3","Zn2CO3","Zn(CO3)2"],"Zinc oxide":["ZnO","ZnO2","Zn2O"],
    "Magnesium chloride":["MgCl2","MgCl","Mg2Cl"],"Magnesium oxide":["MgO","MgO2","Mg2O"],
    "Sodium sulphate":["Na2SO4","NaSO4","Na(SO4)2"],"Sodium chloride":["NaCl","NaCl2","Na2Cl"],
    "Sodium nitrate":["NaNO3","Na(NO3)2","NaNO2"],"Sulphuric acid":["H2SO4","HSO4","H2SO3"],
    "Zinc sulphate":["ZnSO4","Zn2SO4","Zn(SO4)2"],"Copper nitrate":["Cu(NO3)2","CuNO3","Cu2NO3"],
    "Copper sulphate":["CuSO4","Cu2SO4","CuSO3"],"Iron sulphate":["FeSO4","Fe2SO4","FeSO3"],
    "Lead nitrate":["Pb(NO3)2","PbNO3","Pb2NO3"],"Lead iodide":["PbI2","PbI","LeI2"],
    "Potassium nitrate":["KNO3","K(NO3)2","KNO2"],"Lead chloride":["PbCl2","PbCl","LeCl2"]
  };

  // ---------- textbook equations ----------
  // [reactants, products, type, reactant names, product names]
  const RAW=[
    [["Mg","O2"],["MgO"],"comb",["Magnesium","Oxygen"],["Magnesium oxide"]],
    [["Zn","H2SO4"],["ZnSO4","H2"],"disp",["Zinc","Sulphuric acid"],["Zinc sulphate","Hydrogen"]],
    [["Fe","H2O"],["Fe3O4","H2"],null],
    [["H2","O2"],["H2O"],"comb",["Hydrogen","Oxygen"],["Water"]],
    [["CH4","O2"],["CO2","H2O"],null],
    [["C6H12O6","O2"],["CO2","H2O"],null],
    [["FeSO4"],["Fe2O3","SO2","SO3"],"decomp"],
    [["Pb(NO3)2"],["PbO","NO2","O2"],"decomp"],
    [["H2O"],["H2","O2"],"decomp",["Water"],["Hydrogen","Oxygen"]],

  const fxT=s=>String(s).replace(/([A-Za-z)])(\d+)/g,"$1<sub>$2</sub>");
  const tag=(id,src)=>{const t=$(id);t.textContent=src;t.classList.toggle("think",!src.startsWith("📘"));};
  const sel=(arr,nums)=>nums.map(n=>arr[n-1]);
  function makeSeq(o){
    // o: {pre, CORE, BONUS}: textbook core questions first, then a bonus round, then all again
    const P=o.pre;let list=[],i=0,round=0;
    const fill=()=>{round++;
      const mix=a=>round===1?a:shuffle(a);
      const c=mix(o.CORE).map((x,k)=>Object.assign({},x,{_b:0,_n:k+1})),b=mix(o.BONUS).map((x,k)=>Object.assign({},x,{_b:1,_n:k+1}));
      list=[...c,...b];i=0;};
    const showItem=it=>{
      const T=$(P+"Tag");
      if(it._b){T.textContent=`⭐ Bonus ${it._n} of ${o.BONUS.length}`;T.classList.add("think");}
      else{T.textContent=`${it.src||"📘 Textbook"} · ${it._n} of ${o.CORE.length}`;T.classList.remove("think");}
      $(P+"Q").innerHTML=fxT(it.q);
      const E=$(P+"Eq");
      if(it.eq){E.hidden=false;E.className="eqshow";E.innerHTML=eqH(it.eq);}
      else if(it.card){E.hidden=false;E.className="eqshow cardline";E.innerHTML=`<span class="ic">${it.card[0]}</span> ${fxT(it.card[1])}`;}
      else E.hidden=true;
      const PB=$(P+"Pic");
      if(PB){const sv=PB.querySelector("svg");sv.innerHTML="";sv.setAttribute("viewBox","0 0 640 240");
        PB.hidden=!it.pic;PB.closest(".game").classList.toggle("haspic",!!it.pic);if(it.pic)drawPic(it,sv);}
      const box=$(P+"Opts");box.className="opts txt"+(it.lay==="col"?" col":it.lay==="three"?" three":"");
      quiz(box,shuffle([it.a,...it.t]),x=>x===it.a,x=>fxT(x),ok=>{
        setMsg(P+"Msg",ok?"ok":"bad",(ok?"Correct! ":`Answer: <b>${fxT(it.a)}</b>. `)+fxT(it.w));$(P+"Next").hidden=false;});
      setMsg(P+"Msg","",it.hint||"Choose the right answer.");$(P+"Next").hidden=true;
    };
    const next=()=>{
      if(i>=list.length){fill();banner(`🔁 Round ${round}: all ${list.length} again`);}
      const it=list[i++];
      if(it._b&&it._n===1){banner("⭐ Bonus round!");Snd.fan();}
      showItem(it);
    };
    fill();
    $(P+"Next").onclick=next;
    return next;
  }

  // ---------- 1. Balance It ----------
  let B=null;
  // [equation number in RAW, w = start from word-equation / f = formulae given, textbook place]
  const BAL_CORE=[[1,"f","📝 Exam question"],[3,"f","📝 Exam question"],[5,"f","📝 Exam question"],[26,"w","In-text Q2 (i)"],[27,"w","In-text Q2 (ii)"],[28,"w","In-text Q2 (iii)"],[12,"w","In-text Q3 (i)"],[38,"w","In-text Q3 (ii)"],
    [16,"f","Exercise 1"],[17,"f","Exercise 2"],[29,"w","Exercise 5 (a)"],[30,"w","Exercise 5 (b)"],[31,"w","Exercise 5 (d)"],
    [18,"f","Exercise 6 (a)"],[19,"f","Exercise 6 (b)"],[20,"f","Exercise 6 (c)"],[21,"f","Exercise 6 (d)"],
    [24,"w","Exercise 7 (a)"],[32,"w","Exercise 7 (b)"],[33,"w","Exercise 7 (c)"],[34,"w","Exercise 7 (d)"],
    [35,"w","Exercise 8 (a)"],[36,"w","Exercise 8 (b)"],[37,"w","Exercise 8 (d)"],[39,"w","Exercise 14"]];
  const BAL_BONUS=[[7,"f"],[8,"f"],[9,"w"]];
  let balList=[],bi=0,balRound=0;
  function balFill(){balRound++;
    const mix=a=>balRound===1?a:shuffle(a);
    const c=mix(BAL_CORE).map((x,k)=>({eq:EQ[x[0]-1],w:x[1]==="w",src:x[2],b:0,n:k+1})),b=mix(BAL_BONUS).map((x,k)=>({eq:EQ[x[0]-1],w:x[1]==="w",b:1,n:k+1}));
    balList=[...c,...b];bi=0;}
  function balQ(){
    if(bi>=balList.length){balFill();if(balRound>1)banner(`🔁 Round ${balRound}: all ${balList.length} again`);}
    const it=balList[bi++],eq=it.eq,word=it.w&&!!eq.rn;
    if(it.b){if(it.n===1){banner("⭐ Bonus round!");Snd.fan();}tag("balTag",`⭐ Bonus ${it.n} of ${BAL_BONUS.length}`);}
    else tag("balTag",`${it.src.startsWith("📝")?it.src:"📘 "+it.src} · ${it.n} of ${BAL_CORE.length}`);
    const n=eq.r.length+eq.p.length;
    B={eq,n,mode:word?"word":"bal",wi:0,coef:new Array(n).fill(0),sel:0,done:false,scored:false,bad:false};
    $("balNext").hidden=true;$("balShow").hidden=true;
    if(word){
      $("balQ").textContent="Write the equation from words, then balance it";
      $("balH").textContent="Step 1: pick the correct formula for each name.";
      setMsg("balMsg","","");$("balCheck").hidden=true;
    }else startBalance(false);
    render();
  }
  const termF=i=>i<B.eq.r.length?B.eq.r[i]:B.eq.p[i-B.eq.r.length];
  const termN=i=>i<B.eq.r.length?B.eq.rn[i]:B.eq.pn[i-B.eq.r.length];
  function startBalance(fromWord){
    B.mode="bal";B.sel=0;
    $("balQ").textContent=fromWord?"Skeletal equation ready. Now balance it":"Balance this equation";
    $("balH").textContent="Tap a box, then tap a number. An empty box means 1.";

    $("balCheck").hidden=false;
  }
  function render(){
    const nr=B.eq.r.length;let h="";
    for(let i=0;i<B.n;i++){

        h+= i<B.wi?`<span class="term filled">${fx(termF(i))}</span>`

      }else{
        const v=B.coef[i]||"";
        h+=`<span class="term"><button class="cbox${!B.done&&B.sel===i?" sel":""}" data-i="${i}" aria-label="Number for ${termF(i)}"${B.done?" disabled":""}>${v}</button><span>${fx(termF(i))}</span></span>`;
      }
    }
    $("eqRow").innerHTML=h;
    $("eqRow").querySelectorAll(".cbox").forEach(b=>b.onclick=()=>{B.sel=+b.dataset.i;render();});
    renderPanel();renderAtoms();
  }
  function renderPanel(){
    const P=$("balPanel");

        const b=document.createElement("button");b.className="btn";b.innerHTML=`<span class="lbl one">${fx(f)}</span>`;

      P.innerHTML=`<div class="strip">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="num" data-n="${n}">${n}</button>`).join("")}</div>`;

  const cvals=()=>B.coef.map(v=>v||1);

  $("balShow").onclick=()=>{B.bad=true;B.coef=B.eq.c.map(v=>v>1?v:0);finish("","The balanced equation is "+eqH(B.eq.s));};
  function finish(cls,html){
    B.done=true;render();setMsg("balMsg",cls,html);
    $("balCheck").hidden=true;$("balShow").hidden=true;
    const P=$("balPanel");
    if(B.eq.t){
      P.innerHTML=`<p>Bonus: what type of reaction is this?</p><div class="row4"></div>`;

        setMsg("balMsg",ok?"ok":"bad",`${ok?"Correct!":"Not quite."} It is <b>${TYPE[B.eq.t].toLowerCase()}</b>. ${WHY[B.eq.t]}`);
        balScore(ok);$("balNext").hidden=false;},false,true);
    }else{P.innerHTML="";balScore(true);$("balNext").hidden=false;}
  }
  function balScore(lastOk){
    if(B.scored)return;B.scored=true;const ok=!B.bad&&lastOk;mark(ok);
    if(!ok){const m=$("balMsg");m.className="msg bad";m.innerHTML+=" <b>No mark this time.</b>";}
  }
  $("balNext").onclick=balQ;

  // ---------- 2. Reaction Type ----------
  const TYPED=EQ.filter(e=>e.t);
  function typQ(){
    if(Math.random()<.55){
      const e=one(TYPED);
      $("typQ").textContent="What type of reaction is this?";
      $("typEq").innerHTML=eqH(e.s);$("typEq").hidden=false;
      $("typOpts").className="opts";
      quiz($("typOpts"),Object.keys(TYPE),k=>k===e.t,k=>TYPE[k],ok=>{
        setMsg("typMsg",ok?"ok":"bad",`${ok?"Correct!":"Not quite."} It is <b>${TYPE[e.t].toLowerCase()}</b>. ${WHY[e.t]}`);$("typNext").hidden=false;});
    }else{
      const k=one(Object.keys(TYPE));
      const e=one(TYPED.filter(x=>x.t===k));
      const others=shuffle(Object.keys(TYPE).filter(x=>x!==k)).map(t=>one(TYPED.filter(x=>x.t===t)));
      $("typQ").innerHTML=`Which one is a <b>${TYPE[k].toLowerCase()}</b> reaction?`;
      $("typEq").hidden=true;

      quiz($("typOpts"),shuffle([e,...others]),x=>x.t===k,x=>eqH(x.s),ok=>{
        setMsg("typMsg",ok?"ok":"bad",`${ok?"Correct!":"Not quite."} ${WHY[k]}`);$("typNext").hidden=false;});
    }

  // ---------- 3. Redox ----------
  const RX=[
    {e:"CuO + H2 → Cu + H2O",ox:["H2","gO"],red:["CuO","lO"],all:["CuO","H2","Cu","H2O"]},
    {e:"ZnO + C → Zn + CO",ox:["C","gO"],red:["ZnO","lO"],all:["ZnO","C","Zn","CO"]},
    {e:"MnO2 + 4HCl → MnCl2 + 2H2O + Cl2",ox:["HCl","lH"],red:["MnO2","lO"],all:["MnO2","HCl","MnCl2","H2O","Cl2"]},
    {e:"2PbO + C → 2Pb + CO2",ox:["C","gO"],red:["PbO","lO"],all:["PbO","C","Pb","CO2"]},
    {e:"Fe2O3 + 2Al → Al2O3 + 2Fe",ox:["Al","gO"],red:["Fe2O3","lO"],all:["Fe2O3","Al","Al2O3","Fe"]}
  ];
  const OXI=[
    {e:"2Cu + O2 → 2CuO",f:"Cu",all:["Cu","O2","CuO"]},
    {e:"2Mg + O2 → 2MgO",f:"Mg",all:["Mg","O2","MgO"]},
    {e:"4Na + O2 → 2Na2O",f:"Na",all:["Na","O2","Na2O"]},
    {e:"C + O2 → CO2",f:"C",all:["C","O2","CO2"]}
  ];
  const SAFE=["CaCO3 → CaO + CO2","ZnCO3 → ZnO + CO2","CaO + H2O → Ca(OH)2","NaOH + HCl → NaCl + H2O",
    "NaCl + AgNO3 → AgCl + NaNO3","Na2SO4 + BaCl2 → BaSO4 + 2NaCl","Pb(NO3)2 + 2KI → PbI2 + 2KNO3",
    "2HNO3 + Ca(OH)2 → Ca(NO3)2 + 2H2O","BaCl2 + H2SO4 → BaSO4 + 2HCl","Ca(OH)2 + CO2 → CaCO3 + H2O"];
  const HOW={gO:"gains oxygen",lO:"loses oxygen",gH:"gains hydrogen",lH:"loses hydrogen"};
  const RULE="Gain of oxygen or loss of hydrogen = oxidation. Loss of oxygen or gain of hydrogen = reduction.";
  function rdxQ(){
    const kind=one(["what","what","ox","red","redox","oxr","redr"]);
    const box=$("rdxOpts");box.className="opts";$("rdxEq").hidden=false;
    const done=(ok,txt)=>{setMsg("rdxMsg",ok?"ok":"bad",(ok?"Correct! ":"Not quite. ")+txt);$("rdxNext").hidden=false;};
    if(kind==="what"){
      // what happens to one substance, and why
      let f,res,how,e;
      if(Math.random()<.7){const r=one(RX);e=r.e;const s=Math.random()<.5?["ox",...r.ox]:["red",...r.red];[res,f,how]=s;}
      else{const o=one(OXI);e=o.e;f=o.f;res="ox";how="gO";}
      const set=(how==="lH"||how==="gH")?[["ox","lH"],["ox","gH"],["red","gH"],["red","lH"]]:[["ox","gO"],["ox","lO"],["red","lO"],["red","gO"]];
      $("rdxQ").innerHTML=`What happens to <b>${fx(f)}</b> in this reaction?`;
      $("rdxEq").innerHTML=eqH(e);
      quiz(box,shuffle(set),x=>x[0]===res&&x[1]===how,x=>`${x[0]==="ox"?"Oxidised":"Reduced"}: it ${HOW[x[1]]}`,ok=>
        done(ok,`${fx(f)} ${HOW[how]}, so it is <b>${res==="ox"?"oxidised":"reduced"}</b>.`));
    }else if(kind==="ox"||kind==="red"){
      let e,f,how,all;

      else{const r=one(RX);e=r.e;[f,how]=kind==="ox"?r.ox:r.red;all=r.all;}
      const opts=shuffle([f,...pick(all.filter(x=>x!==f),3)]);

      $("rdxEq").innerHTML=eqH(e);

      // pick the reaction

      else if(kind==="oxr"){const o=one(OXI);right=o.e;q="Which reaction shows <b>oxidation</b>?";why=`${fx(o.f)} gains oxygen, so it is oxidised.`;}

    }

  }

  function fitBin(IN){const sp=[...IN.children];sp.forEach(e=>e.style.fontSize="");let fs=sp.length?parseFloat(getComputedStyle(sp[0]).fontSize):0,k=0;
    while(sp.length&&IN.scrollHeight>IN.clientHeight+1&&fs>11&&k<24){fs-=1;sp.forEach(e=>e.style.fontSize=fs+"px");k++;}}

        $("heatNext").hidden=false;

    }else{

      setMsg("heatMsg","bad",`Try again. ${h[2]}`);
    }
    chip.classList.remove("sel");selChip=null;
  }
  const binAt=(x,y)=>[...document.querySelectorAll(".bin")].find(b=>{const r=b.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;})||null;
  function attachDrag(chip){
    let sx,sy,ghost=null,id=null;
    chip.addEventListener("pointerdown",e=>{sx=e.clientX;sy=e.clientY;id=e.pointerId;chip.setPointerCapture(id);});
    chip.addEventListener("pointermove",e=>{
      if(id!==e.pointerId)return;
      if(!ghost&&Math.hypot(e.clientX-sx,e.clientY-sy)>8){ghost=chip.cloneNode(true);ghost.classList.add("ghost");ghost.style.width=chip.offsetWidth+"px";document.body.appendChild(ghost);chip.style.opacity=.3;}
      if(ghost){ghost.style.left=e.clientX+"px";ghost.style.top=e.clientY+"px";const h=binAt(e.clientX,e.clientY);document.querySelectorAll(".bin").forEach(b=>b.classList.toggle("hover",b===h));}
    });
    const end=e=>{
      if(id!==e.pointerId)return;id=null;
      if(ghost){const b=binAt(e.clientX,e.clientY);ghost.remove();ghost=null;chip.style.opacity="";document.querySelectorAll(".bin").forEach(x=>x.classList.remove("hover"));if(b&&e.type==="pointerup")drop(chip,b.dataset.bin);}
